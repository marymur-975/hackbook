name: Validate Payloads

# Проверка качества контента на каждом PR и пуше:
#   * формат карточек payload'ов и глав (front-matter, секции, ссылки);
#   * целостность графа знаний (типы рёбер, отсутствие dangling-ссылок);
#   * словари: кодировка, дубликаты, метаданные, отсутствие секретов;
#   * битые ссылки во всех Markdown-файлах;
#   * регенерация графа — коммит не должен расходиться с артефактом.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content:
    name: Формат контента
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML (ускоряет парсинг метаданных)
        run: pip install PyYAML

      - name: Validate payload cards (strict)
        run: python tools/validate-payloads.py --strict --json artifacts/payloads.json

      - name: Validate wordlists
        run: python tools/wordlist-validator.py --secrets --strict --json artifacts/wordlists.json

      - name: Check internal links
        run: python tools/link-checker.py

      - name: Check links to external references
        continue-on-error: true          # внешние сайты могут быть временно недоступны
        run: python tools/link-checker.py --external --timeout 10

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: artifacts/
          if-no-files-found: ignore

  graph:
    name: Граф знаний не расходится с контентом
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate graph integrity
        run: python tools/graph-generator.py --check

      - name: Regenerate graph
        run: python tools/graph-generator.py --pretty

      - name: Ensure committed graph.json is up to date
        run: |
          if ! git diff --quiet -- payloads/graph/graph.json; then
            echo "::error::payloads/graph/graph.json устарел."
            echo "Запустите локально: python tools/graph-generator.py --pretty"
            echo "и закоммитьте результат (артефакт генерируется из метаданных Markdown)."
            git diff --stat -- payloads/graph/graph.json
            exit 1
          fi
          echo "graph.json актуален."

  hygiene:
    name: Гигиена репозитория
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: No absolute paths / no tabs / no CRLF in text files
        run: |
          fail=0
          # CRLF
          if git grep -IlU $'\r' -- ':!*.png' ':!*.jpg' | head -20 | grep -q .; then
            echo "::error::Найдены файлы с CRLF:"; git grep -IlU $'\r' | head -20; fail=1
          fi
          # табы в Python/Markdown/YAML
          if git grep -InP '\t' -- '*.py' '*.md' '*.yml' '*.yaml' | head -20 | grep -q .; then
            echo "::warning::Табуляция в текстах (приведите к пробелам):"
            git grep -InP '\t' -- '*.py' '*.md' '*.yml' '*.yaml' | head -20
          fi
          # служебные маркеры
          if git grep -nE 'ARENA_WORKSPACE|/home/user/' -- '*.py' '*.sh' '*.yml' '*.yaml' | grep -q .; then
            echo "::error::Найдены абсолютные пути окружения сборки:"
            git grep -nE 'ARENA_WORKSPACE|/home/user/' -- '*.py' '*.sh' '*.yml' '*.yaml' | head
            fail=1
          fi
          exit $fail

      - name: Shell scripts pass bash -n
        run: |
          for f in $(git ls-files '*.sh'); do
            echo "checking $f"
            bash -n "$f" || exit 1
          done

      - name: Python files compile
        run: |
          python -m compileall -q tools/ >/dev/null
          for f in $(git ls-files '*.py'); do python -c "import ast,sys; ast.parse(open(sys.argv[1],encoding='utf-8').read())" "$f" || exit 1; done

      - name: No secrets in tracked files
        run: |
          python tools/wordlist-validator.py --secrets --strict >/dev/null || exit 1
          if git grep -nE 'AKIA[0-9A-Z]{16}|-----BEGIN (RSA |OPENSSH )?PRIVATE KEY-----' -- . ':!wordlists' ':!payloads' | head; then
            echo "::error::Похоже на утечку секрета"; exit 1
          fi
