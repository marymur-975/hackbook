name: Deploy Graph & Site

# Публикация на GitHub Pages:
#   /            — сайт книги (MkDocs Material)
#   /graph/      — интерактивный граф знаний
#   /download/   — собранные PDF и EPUB
#
# GitHub Pages включается в настройках репозитория:
#   Settings → Pages → Source: GitHub Actions

on:
  push:
    branches: [main]
    paths:
      - 'book/**'
      - 'payloads/**'
      - 'tools/**'
      - 'wordlists/**'
      - '.github/workflows/deploy-graph.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Сборка публичной части
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # нужен для git-revision-date плагинов

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install system libs for WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0 \
            shared-mime-info fonts-dejavu-core fonts-liberation

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Regenerate knowledge graph
        run: python tools/graph-generator.py --pretty

      - name: Generate docs tree from book/src
        run: python tools/mkdocs-site.py --clean

      - name: Build MkDocs site
        run: mkdocs build --config-file book/mkdocs.yml

      - name: Build PDF + EPUB
        run: python tools/pdf-builder.py --format all --out-dir book/build

      - name: Assemble public directory
        run: |
          mkdir -p public/graph public/download
          # сайт книги
          cp -r book/build/site/* public/
          # граф знаний отдельным разделом
          cp payloads/graph/index.html public/graph/index.html
          cp payloads/graph/graph.json public/graph/graph.json
          # загружаемые книги
          cp book/build/hackbook.pdf  public/download/hackbook.pdf
          cp book/build/hackbook.epub public/download/hackbook.epub
          cp book/build/hackbook.html public/download/hackbook.html
          # страница-заглушка для /download
          cat > public/download/index.html <<'HTML'
          <!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
          <title>hackbook — скачать книгу</title>
          <style>body{font:16px/1.6 system-ui,sans-serif;max-width:40rem;margin:4rem auto;
          padding:0 1rem;color:#1c1e21}a{color:#5f3dc4}li{margin:.4rem 0}</style></head>
          <body><h1>hackbook — скачать книгу</h1>
          <ul>
            <li><a href="hackbook.pdf">PDF</a></li>
            <li><a href="hackbook.epub">EPUB</a></li>
            <li><a href="hackbook.html">единый HTML-файл</a></li>
            <li><a href="../">Читать на сайте</a> · <a href="../graph/">граф знаний</a></li>
          </ul>
          <p><small>Файлы генерируются автоматически из <code>book/src/</code>
          при каждом пуше в <code>main</code>.</small></p></body></html>
          HTML
          ls -la public public/graph public/download

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
