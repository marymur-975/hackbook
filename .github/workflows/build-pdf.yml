name: Build Book

# Сборка книги: HTML-сайт (MkDocs), единый HTML-бандл, PDF и EPUB.
# Артефакты прикрепляются к каждому прогону; публикация — в deploy-graph.yml.

on:
  push:
    branches: [main]
    paths:
      - 'book/**'
      - 'payloads/**'
      - 'tools/**'
      - 'wordlists/metadata.yaml'
      - 'requirements.txt'
      - '.github/workflows/build-pdf.yml'
  pull_request:
    branches: [main]
    paths:
      - 'book/**'
      - 'payloads/**'
      - 'tools/**'
  workflow_dispatch:
    inputs:
      formats:
        description: "Форматы сборки (all / html / pdf / epub)"
        required: false
        default: "all"

permissions:
  contents: read

concurrency:
  group: book-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Сборка книги (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [pdf-epub, mkdocs-site]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install system libs for WeasyPrint
        if: matrix.target == 'pdf-epub'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0 \
            shared-mime-info fonts-dejavu-core fonts-liberation

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── PDF / EPUB / HTML-бандл ────────────────────────────────────
      - name: Validate chapters are discoverable
        if: matrix.target == 'pdf-epub'
        run: python tools/pdf-builder.py --check

      - name: Build PDF + EPUB + HTML bundle
        if: matrix.target == 'pdf-epub'
        run: |
          python tools/pdf-builder.py \
            --format "${{ github.event.inputs.formats || 'all' }}" \
            --out-dir book/build

      - name: Check artifacts exist and are not empty
        if: matrix.target == 'pdf-epub'
        run: |
          ls -la book/build/
          test -s book/build/hackbook.html
          test -s book/build/hackbook.epub
          test -s book/build/hackbook.pdf

      - name: Upload book artifacts
        if: matrix.target == 'pdf-epub'
        uses: actions/upload-artifact@v4
        with:
          name: hackbook-pdf-epub
          path: |
            book/build/hackbook.pdf
            book/build/hackbook.epub
            book/build/hackbook.html
          if-no-files-found: error
          retention-days: 30

      # ── MkDocs-сайт ────────────────────────────────────────────────
      - name: Generate docs tree from book/src
        if: matrix.target == 'mkdocs-site'
        run: python tools/mkdocs-site.py --clean

      - name: Build site (strict)
        if: matrix.target == 'mkdocs-site'
        run: mkdocs build --config-file book/mkdocs.yml --strict

      - name: Upload site artifact
        if: matrix.target == 'mkdocs-site'
        uses: actions/upload-artifact@v4
        with:
          name: hackbook-site
          path: book/build/site
          if-no-files-found: error
          retention-days: 30

  # ── релизные артефакты для тегов ──────────────────────────────────
  release-assets:
    name: Прикрепить книги к релизу
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: hackbook-pdf-epub
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/hackbook.pdf
            dist/hackbook.epub
          generate_release_notes: true
          fail_on_unmatched_files: true
