name: Lab Smoke Tests

# Проверяет, что карточки payload'ов действительно работают на лабораториях,
# а лабы собираются и отвечают. Запуск: по расписанию, вручную и на PR,
# затрагивающий labs/, tools/payload-tester.sh или payloads/web/{sqli,xss}.
#
# Все запросы идут ТОЛЬКО на 127.0.0.1 внутри раннера: tools/payload-tester.sh
# отказывается работать с любыми другими целями.

on:
  schedule:
    - cron: '17 3 * * 1'          # каждый понедельник, чтобы карточки не «протухали»
  pull_request:
    branches: [main]
    paths:
      - 'labs/**'
      - 'payloads/web/sqli/**'
      - 'payloads/web/xss/**'
      - 'tools/payload-tester.sh'
      - 'tools/lib/http_fetch.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: labs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  labs:
    name: Лаборатории и payload'ы
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build lab images
        working-directory: labs/setup
        run: docker compose build sqli-lab xss-lab

      - name: Start labs (published on 127.0.0.1 only)
        working-directory: labs/setup
        run: |
          docker compose up -d sqli-lab xss-lab
          docker compose ps

      - name: Wait for health
        run: |
          for port in 8080 8081; do
            for i in $(seq 1 40); do
              if python3 tools/lib/http_fetch.py "http://127.0.0.1:${port}/health" 3 >/dev/null 2>&1; then
                echo "port ${port} готов"; break
              fi
              sleep 2
            done
          done

      - name: Run SQLi payload tests
        run: |
          mkdir -p artifacts
          ./tools/payload-tester.sh --lab sqli-lab --report artifacts/sqli-report.json

      - name: Run XSS payload tests
        run: |
          ./tools/payload-tester.sh --lab xss-lab --report artifacts/xss-report.json

      - name: Verify safe endpoints stay safe
        run: |
          # контрольная точка: на параметризованном эндпоинте ошибка СУБД не появляется
          python3 - <<'PY'
          import sys, urllib.parse
          sys.path.insert(0, "tools/lib")
          from http_fetch import main  # noqa: F401  (используем как пример)
          import urllib.request
          def body(url):
              try:
                  with urllib.request.urlopen(url, timeout=5) as r:
                      return r.read().decode("utf-8", "replace")
              except Exception as e:
                  return str(e)
          bad = body("http://127.0.0.1:8080/item_safe?id=" + urllib.parse.quote("1'"))
          assert "SQL error" not in bad, "item_safe начал раскрывать ошибки СУБД"
          good = body("http://127.0.0.1:8081/safe?q=" + urllib.parse.quote("<svg onload=alert(1)>"))
          assert "<svg onload" not in good, "/safe отражает вектор без экранирования"
          print("Контрольные точки в порядке: safe-эндпоинты не уязвимы")
          PY

      - name: Lab logs (для разбора падений)
        if: always()
        working-directory: labs/setup
        run: docker compose logs --tail=120 || true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-test-reports
          path: artifacts/
          if-no-files-found: ignore

      - name: Stop labs
        if: always()
        working-directory: labs/setup
        run: docker compose down -v --remove-orphans || true
