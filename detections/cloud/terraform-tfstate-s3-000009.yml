# Команда: python tools/detections-extract.py
# Не редактируйте здесь — правьте секцию `Detection rules` в карточке.
title: Чтение terraform.tfstate из S3 — файл с секретами в открытом виде
id: f6a7b8c9-0009-4f6a-8b9c-000000000009
status: experimental
description: 'GetObject к ключам *.tfstate/tfstate.backup: состояние Terraform хранит секреты (пароли
  БД, ключи) plain-text. Любой неожиданный читатель — потенциальная утечка.'
references:
- https://attack.mitre.org/techniques/T1552/005/
- https://developer.hashicorp.com/terraform/language/state/sensitive-data
logsource:
  product: aws
  service: cloudtrail
  definition: CloudTrail data events для S3 бакета состояний
detection:
  selection:
    eventSource: s3.amazonaws.com
    eventName: GetObject
  tfstate_key:
    requestParameters.key|contains:
    - .tfstate
    - tfstate.backup
  filter_ci:
    userIdentity.sessionContext.sessionIssuer.userName|startswith: terraform-
  condition: selection and tfstate_key and not filter_ci
fields:
- userIdentity.sessionContext.sessionIssuer.userName
- sourceIPAddress
- requestParameters.bucketName
- requestParameters.key
falsepositives:
- CI-пайплайны terraform (префикс terraform-* в filter_ci) и разработчики во время apply — сверяйте с
  расписанием деплоев
level: high
tags:
- attack.credential_access
- attack.t1552.005
- cwe.312
author: hackbook
related:
- 'payloads-card: payloads/cloud/aws-tfstate-secrets-exposure.md'
