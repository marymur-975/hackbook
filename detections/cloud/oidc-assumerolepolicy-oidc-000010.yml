# Команда: python tools/detections-extract.py
# Не редактируйте здесь — правьте секцию `Detection rules` в карточке.
title: Изменение OIDC-доверия — AssumeRolePolicy и новые OIDC-провайдеры
id: f6a7b8c9-0010-4f6a-8b9c-000000000010
status: experimental
description: 'UpdateAssumeRolePolicy для ролей с github-deploy/oidc в имени либо создание OIDC-провайдера:
  расширение федеративного доверия позволяет чужим GitHub Actions-воркфлоу принимать роль аккаунта.'
references:
- https://attack.mitre.org/techniques/T1098/
- https://docs.github.com/en/actions/deployment/security-hardening-your-deployments/configuring-openid-connect-in-amazon-web-services
logsource:
  product: aws
  service: cloudtrail
  definition: CloudTrail management events IAM
detection:
  trust_change:
    eventSource: iam.amazonaws.com
    eventName:
    - UpdateAssumeRolePolicy
    - UpdateAssumeRolePolicyDocument
  oidc_provider:
    eventSource: iam.amazonaws.com
    eventName: CreateOIDCProvider
  filter_ci_admin:
    userIdentity.sessionContext.sessionIssuer.userName: iam-breakglass
  condition: (trust_change or oidc_provider) and not filter_ci_admin
fields:
- userIdentity.sessionContext.sessionIssuer.userName
- sourceIPAddress
- requestParameters.roleName
falsepositives:
- плановые изменения федераций через IaC (исключайте роли pipeline-админа, но проверяйте diff политики
  — token.sub должен ограничивать репозиторий и ветку)
level: high
tags:
- attack.persistence
- attack.t1098
- cwe.287
author: hackbook
related:
- 'payloads-card: payloads/cloud/aws-oidc-github-actions-trust.md'
