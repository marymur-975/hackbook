# Команда: python tools/detections-extract.py
# Не редактируйте здесь — правьте секцию `Detection rules` в карточке.
title: Privileged-под с hostPath / — захват узла через монтирование корня
id: f6a7b8c9-0004-4f6a-8b9c-000000000004
status: experimental
description: В spec создаваемого пода встречаются securityContext.privileged=true, hostPath с path "/"
  или монтирование /host — из такого контейнера узел берётся за секунды (chroot /host, запись в /etc,
  кража kubelet-сертификатов).
references:
- https://attack.mitre.org/techniques/T1610/
- https://kubernetes.io/docs/concepts/security/pod-security-standards/
logsource:
  product: kubernetes
  service: audit
  definition: Kubernetes Audit Log с requestObject (policy-уровень Request)
detection:
  pod_create:
    verb: create
    objectRef_resource:
    - pods
    - deployments
    - daemonsets
    - statefulsets
  dangerous_spec:
    requestObject|contains:
    - '"hostPath"'
    - '"privileged":true'
    - '"path":"/"'
    - mountPath":"/host
    - hostPID":true
    - hostNetwork":true
  condition: pod_create and dangerous_spec
fields:
- user_username
- objectRef_namespace
- objectRef_name
- requestObject
falsepositives:
- инфраструктурные агенты (мониторинг узлов, CNI, CSI) — ведите allowlist неймспейсов и Pod Security Admission
  вместо исключений в правиле
level: critical
tags:
- attack.privilege_escalation
- attack.t1610
- cwe.250
author: hackbook
related:
- 'payloads-card: payloads/cloud/kubernetes-hostpath-node-takeover.md'
