title: Злоупотребление SA-токеном пода — exec, секреты и чужие ресурсы
id: f6a7b8c9-0005-4f6a-8b9c-000000000005
status: experimental
description: 'Сервисный аккаунт пода (system:serviceaccount:...) совершает действия за пределами своей
  роли: exec в другие поды, list/get secrets, создание подов. Токен из /var/run/secrets/... — первая цель
  атакующего после RCE в контейнере.'
references:
- https://attack.mitre.org/techniques/T1552/001/
- https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/
logsource:
  product: kubernetes
  service: audit
  definition: Kubernetes Audit Log
detection:
  selection:
    user_username|startswith: 'system:serviceaccount:'
  suspicious_ops:
    objectRef_subresource: exec
  suspicious_resources:
    objectRef_resource:
    - secrets
    - pods
    - serviceaccounts
  filter_infra:
    user_username|contains:
    - prometheus
    - monitoring
    - system:node
    - kube-proxy
  condition: selection and (suspicious_ops or suspicious_resources) and not filter_infra
fields:
- user_username
- verb
- objectRef_resource
- objectRef_subresource
- objectRef_namespace
falsepositives:
- CI-деплоеры, легитимно создающие поды в своём неймспейсе — сужайте suspicious_resources по objectRef_namespace
  и дополняйте filter_infra
level: high
tags:
- attack.credential_access
- attack.t1552.001
- cwe.269
author: hackbook
related:
- 'payloads-card: payloads/cloud/kubernetes-pod-sa-token.md'
