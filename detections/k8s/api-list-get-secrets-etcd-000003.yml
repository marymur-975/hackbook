title: Доступ к секретам кластера — API list/get secrets и прямое чтение etcd
id: f6a7b8c9-0003-4f6a-8b9c-000000000003
status: experimental
description: Массовое чтение secrets через API (list) или прямой доступ к etcd по URI /v2/keys/registry/secrets.
  При отсутствии EncryptionConfiguration секреты в etcd лежат открытым текстом — любой доступ к диску/порту
  2379 равносилен компрометации.
references:
- https://attack.mitre.org/techniques/T1552/007/
- https://kubernetes.io/docs/tasks/administer-cluster/encrypt-data/
logsource:
  product: kubernetes
  service: audit
  definition: Kubernetes Audit Log + access-лог etcd
detection:
  api_secrets_list:
    verb:
    - list
    - watch
    objectRef_resource: secrets
  api_secret_get:
    verb: get
    objectRef_resource: secrets
  etcd_direct:
    requestURI|contains:
    - /v2/keys/registry/secrets
    - /v3/kv/range
  filter_controller:
    user_username|startswith: system:kube-
  condition: (api_secrets_list or api_secret_get or etcd_direct) and not filter_controller
fields:
- user_username
- verb
- objectRef_namespace
- objectRef_name
- requestURI
falsepositives:
- контроллеры и операторы, легитимно читающие свои секреты — отфильтрованы по system:kube-*; дополните
  список своими сервисными аккаунтами-контроллерами
level: high
tags:
- attack.credential_access
- attack.t1552.007
- cwe.311
author: hackbook
related:
- 'payloads-card: payloads/cloud/kubernetes-etcd-no-encryption.md'
