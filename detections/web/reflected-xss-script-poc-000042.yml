title: Reflected XSS — script-тег и PoC-маркеры в параметре запроса
id: e5f6a7b8-0042-4e5f-9a7b-000000000042
status: experimental
description: В query-строке встречается тег <script>, закрывающий </script> или типовые proof-маркеры
  (alert(document.domain)). Отражение такого параметра в ответе — подтверждённый reflected XSS; маркеры
  ловят и векторы без script-тега.
references:
- https://attack.mitre.org/techniques/T1189/
- https://owasp.org/www-community/attacks/xss/
logsource:
  category: webserver
  definition: access-лог с полной query-строкой
detection:
  selection:
    cs-uri-query|contains:
    - <script>alert
    - <script>fetch
    - <script>confirm
    - <script>prompt
    - <script src=
    - </script>
    - alert(document.domain)
  condition: selection
fields:
- c-ip
- cs-uri-stem
- cs-uri-query
- sc-status
falsepositives:
- документация/поиск по коду, легитимно передающие фрагменты JS (уточняйте по cs-uri-stem)
level: high
tags:
- attack.initial_access
- attack.t1189
- cwe.79
author: hackbook
related:
- 'payloads-card: payloads/web/xss/reflected-basic-script.md'
