title: MSSQL xp_cmdshell — попытка выполнения команд на сервере БД
id: e5f6a7b8-0022-4e5f-9a7b-000000000022
status: experimental
description: 'Три независимых признака: xp_cmdshell/EXEC master в параметрах запроса, ошибка MSSQL о заблокированной
  процедуре и — самое надёжное — процесс cmd.exe/powershell.exe, порождённый sqlservr.exe (Sysmon EventID
  1).'
references:
- https://attack.mitre.org/techniques/T1059/
- https://attack.mitre.org/techniques/T1190/
logsource:
  category: webserver
  definition: access-лог, журнал ошибок MSSQL и Sysmon EventID 1 на сервере БД
detection:
  query_probe:
    cs-uri-query|contains:
    - xp_cmdshell
    - sp_configure
    - RECONFIGURE
    - EXEC master..
    - EXECUTE master.
  db_blocked:
    error_message|contains:
    - xp_cmdshell
    - blocked access to procedure
  db_statement:
    statement|contains: xp_cmdshell
  sysmon_child:
    EventID: 1
    ParentImage|endswith: \sqlservr.exe
    Image|endswith:
    - \cmd.exe
    - \powershell.exe
    - \net.exe
    - \whoami.exe
  condition: query_probe or db_blocked or db_statement or sysmon_child
fields:
- c-ip
- cs-uri-query
- error_message
- Image
- CommandLine
- ParentImage
falsepositives:
- легитимные задачи обслуживания через xp_cmdshell (крайне редки; если есть — белый список по CommandLine)
level: critical
tags:
- attack.execution
- attack.t1059
- attack.t1190
- cwe.89
author: hackbook
related:
- 'payloads-card: payloads/web/sqli/mssql-xp-cmdshell.md'
