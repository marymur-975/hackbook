title: SSRF с нестандартными схемами — gopher/dict/ldap/file к внутренним сервисам
id: e5f6a7b8-0072-4e5f-9a7b-000000000072
status: experimental
description: 'Параметр url использует схемы, которые браузер не запрашивает, а серверная HTTP-библиотека
  — запрашивает: gopher:// (контрабанда произвольных протоколов), dict://, ldap://, file://, ftp://. Типичная
  цель — Redis/Memcached/SMTP на 127.0.0.1.'
references:
- https://attack.mitre.org/techniques/T1190/
logsource:
  category: webserver
  definition: access-лог с параметром url
detection:
  selection:
    cs-uri-query|contains:
    - gopher://
    - dict://
    - ldap://
    - ldaps://
    - file://
    - ftp://
    - tftp://
    - sftp://
  condition: selection
fields:
- c-ip
- cs-uri-stem
- cs-uri-query
falsepositives:
- файловые браузеры и интеграции, легитимно принимающие ftp:// (белый список схем по эндпоинту)
level: high
tags:
- attack.initial_access
- attack.t1190
- cwe.918
author: hackbook
related:
- 'payloads-card: payloads/web/ssrf/protocol-smuggling-gopher.md'
