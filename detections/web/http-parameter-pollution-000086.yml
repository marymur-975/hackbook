title: HTTP parameter pollution — дубли параметров в одном запросе
id: e5f6a7b8-0086-4e5f-9a7b-000000000086
status: experimental
description: 'Один и тот же параметр встречается в запросе два и более раза (amount=1& amount=10000):
  фронтенд и бэкенд (или WAF и приложение) берут разные значения — обход валидации и лимитов.'
references:
- https://attack.mitre.org/techniques/T1190/
logsource:
  category: proxy
  definition: журнал шлюза со счётчиком дублирующихся параметров (duplicate_params)
detection:
  selection:
    duplicate_params|gte: 2
  filter_search:
    path|contains:
    - /search
    - /catalog/filter
  condition: selection and not filter_search
fields:
- source_ip
- method
- path
- query
- duplicate_params
falsepositives:
- фильтры каталогов, легитимно передающие повторяющиеся параметры (facet-поиск) — вынесены в filter_search,
  дополняйте своими путями
level: medium
tags:
- attack.initial_access
- attack.t1190
- cwe.235
author: hackbook
related:
- 'payloads-card: payloads/web/http/hpp-parameter-pollution.md'
