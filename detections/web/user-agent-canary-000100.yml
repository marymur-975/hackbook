title: Инъекция в User-Agent — canary-маркеры и подделка формата лог-строки
id: e5f6a7b8-0100-4e5f-9a7b-000000000100
status: experimental
description: User-Agent содержит canary-строки исследователя (HB-CANARY), CRLF или фрагменты формата access-лога
  (« 200 1234 "-"») — попытка подделать записи журнала или проверить лог-инъекцию.
references:
- https://attack.mitre.org/techniques/T1190/
- https://owasp.org/www-community/attacks/Log_Injection
logsource:
  category: webserver
  definition: access-лог с полем User-Agent
detection:
  selection:
    cs-user-agent|contains:
    - '%0d%0a'
    - '%0D%0A'
    - ' 200 1234 '
    - ' - "-" '
    - HB-CANARY
    - CANARY-
    - SUCCESS
  condition: selection
fields:
- c-ip
- cs-uri-stem
- cs-user-agent
falsepositives:
- боты со словом SUCCESS в имени (мониторинги) — уточняйте паттерны под свой формат лога
level: medium
tags:
- attack.defense_evasion
- attack.t1190
- cwe.117
author: hackbook
related:
- 'payloads-card: payloads/web/headers/user-agent-log-injection.md'
