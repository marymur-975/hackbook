title: MySQL boolean-based blind — посимвольные условия SUBSTRING/ASCII
id: e5f6a7b8-0023-4e5f-9a7b-000000000023
status: experimental
description: 'В параметрах видны конструкции посимвольного перебора: SUBSTRING((SELECT..., ASCII(SUBSTRING(...)),
  MID((SELECT..., ORD(MID(...)). Серия таких запросов от одного IP — почти наверняка sqlmap или ручной
  blind-перебор.'
references:
- https://attack.mitre.org/techniques/T1190/
