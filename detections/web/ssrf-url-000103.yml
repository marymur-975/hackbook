title: SSRF — обращение к метаданным или внутренним адресам через параметр URL
id: b2c3d4e5-0003-4b2c-8d3e-000000000103
status: test
description: В query-строке появляются link-local/loopback/приватные адреса, облачные metadata-эндпоинты
  или небезопасные URI-схемы.
references:
- https://attack.mitre.org/techniques/T1552/005/
- payloads/web/ssrf/cloud-metadata-169254.md
logsource:
  category: webserver
  definition: access-лог приложения, принимающего URL в параметре
detection:
  metadata:
    cs-uri-query|contains:
    - 169.254.169.254
    - metadata.google.internal
    - 100.100.100.200
    - 169.254.170.2
    - latest/meta-data
    - computeMetadata
  internal:
    cs-uri-query|contains:
    - 127.0.0.1
    - localhost
    - '[::1]'
    - 0.0.0.0
    - 10.0.
    - 192.168.
    - 172.16.
    - '2130706433'
    - '0x7f000001'
    - '127.1'
    - nip.io
    - localtest.me
  scheme:
    cs-uri-query|contains:
    - file://
    - gopher://
    - dict://
    - ldap://
    - ftp://
  condition: metadata or internal or scheme
fields:
- c-ip
- cs-uri-stem
- cs-uri-query
- sc-status
falsepositives:
- легитимные интеграции, которые по замыслу ходят во внутреннюю сеть (выносите в исключения по cs-uri-stem)
level: high
tags:
- attack.initial_access
- attack.t1552.005
- cwe.918
author: hackbook
related:
- 'payloads-card: payloads/web/detection/webserver-ssrf-metadata.md'
