title: Выход из HTML-атрибута — кавычка и autofocus/onfocus/onmouseover
id: e5f6a7b8-0044-4e5f-9a7b-000000000044
status: experimental
description: Параметр содержит закрывающую кавычку и навешенный обработчик события (autofocus onfocus=,
  onmouseover=) — попытка выйти из атрибута value/href и выполнить JS без тега script.
references:
- https://attack.mitre.org/techniques/T1189/
logsource:
  category: webserver
  definition: access-лог с полной query-строкой
detection:
  selection:
    cs-uri-query|contains:
    - autofocus onfocus=
    - '" onfocus='
    - '" onmouseover='
    - '" onload='
    - '" autofocus'
    - ''' onfocus='
    - '%22%20onfocus'
  condition: selection
fields:
- c-ip
- cs-uri-stem
- cs-uri-query
falsepositives:
- параметры, легитимно содержащие кавычки и слова on* (почти не встречается вне атак)
level: high
tags:
- attack.initial_access
- attack.t1189
- cwe.79
author: hackbook
related:
- 'payloads-card: payloads/web/xss/attribute-breakout-double-quote.md'
