title: Инъекция аргументов в серверные утилиты (curl, tar, find, ssh)
id: e5f6a7b8-0015-4e5f-9a7b-000000000015
status: experimental
description: 'Пользовательские данные попадают не в команду, а в её аргументы: флаги загрузки (-o, --output,
  --upload-file), --checkpoint-action у tar, -exec у find, ProxyCommand у ssh.'
references:
- https://attack.mitre.org/techniques/T1190/
- https://gtfobins.github.io/
logsource:
  category: webserver
  definition: access-лог с полной query-строкой
detection:
  selection:
    cs-uri-query|contains:
    - ' -o /tmp'
    - ' -o /var/www'
    - ' --output'
    - ' --checkpoint-action'
    - ' -exec /'
    - ' --upload-file'
    - ProxyCommand=
    - ' --config '
  condition: selection
fields:
- c-ip
- cs-uri-stem
- cs-uri-query
falsepositives:
- API, легитимно принимающие CLI-подобные параметры (CI-раннеры, конвертеры) — исключайте по cs-uri-stem
level: medium
tags:
- attack.initial_access
- attack.t1190
- cwe.88
author: hackbook
related:
- 'payloads-card: payloads/web/cmdi/argument-injection.md'
