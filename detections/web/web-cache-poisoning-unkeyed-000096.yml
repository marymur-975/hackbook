title: Web cache poisoning — unkeyed-заголовки в закэшированном ответе
id: e5f6a7b8-0096-4e5f-9a7b-000000000096
status: experimental
description: 'Ответ, ушедший в общий кэш (HIT), сформирован с участием заголовков, не входящих в ключ
  кэша: X-Forwarded-Host, X-Forwarded-Scheme, X-Original-URL. Атакующий отравляет кэш для всех пользователей.'
references:
- https://attack.mitre.org/techniques/T1190/
- https://portswigger.net/web-security/web-cache-poisoning
logsource:
  category: proxy
  definition: журнал кэширующего прокси с unkeyed-заголовками и cache_status
detection:
  cache_hit:
    cache_status: HIT
  unkeyed_header:
    x_forwarded_host|contains: .
  unkeyed_scheme:
    x_forwarded_scheme|contains: http
  filter_own_host:
    x_forwarded_host|contains: corp.lab
  condition: cache_hit and (unkeyed_header or unkeyed_scheme) and not filter_own_host
fields:
- source_ip
- path
- x_forwarded_host
- x_forwarded_scheme
- cache_status
falsepositives:
- легитимные CDN-заголовки от своих балансировщиков (исключайте по source_ip)
level: critical
tags:
- attack.initial_access
- attack.t1190
- cwe.525
author: hackbook
related:
- 'payloads-card: payloads/web/http/web-cache-poisoning-unkeyed.md'
