title: Race condition — шквал одинаковых запросов от одного клиента
id: e5f6a7b8-0091-4e5f-9a7b-000000000091
status: experimental
description: 'Single-packet attack: десятки идентичных запросов (применение купона, списание бонусов,
  приглашения) приходят практически одновременно от одного IP. Признаки: count одинаковых запросов по
  c-ip и поле same_ts_requests в журнале шлюза.'
references:
- https://attack.mitre.org/techniques/T1190/
- https://portswigger.net/research/race-conditions-limit-overpassing
logsource:
  category: webserver
  definition: access-лог с меткой времени запроса + журнал шлюза (same_ts_requests)
detection:
  selection_sensitive:
    cs-uri-query|contains:
    - coupon=
    - promo=
    - gift=
    - invite=
  gateway_burst:
    same_ts_requests|gte: 20
  condition: (selection_sensitive | count() by c-ip > 10) or gateway_burst
fields:
- c-ip
- cs-uri-stem
- cs-uri-query
- same_ts_requests
falsepositives:
- ретраи клиентов при таймаутах (те же URL, но растянуты во времени — сравнивайте разброс ts внутри группы)
level: high
tags:
- attack.impact
- attack.t1190
- cwe.362
author: hackbook
related:
- 'payloads-card: payloads/web/http/race-condition-single-packet.md'
