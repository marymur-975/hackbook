title: CORS — отражение стороннего Origin с Access-Control-Allow-Credentials
id: e5f6a7b8-0097-4e5f-9a7b-000000000097
status: experimental
description: 'Ответ содержит ACAO, повторяющий запросивший Origin (включая null), вместе с Allow-Credentials:
  true — любой сайт может читать аутентифицированные ответы API от имени пользователя.'
references:
- https://attack.mitre.org/techniques/T1190/
- https://portswigger.net/web-security/cors
logsource:
  category: proxy
  definition: журнал шлюза с Origin запроса и ACAO/ACAC ответа
detection:
  credentialed:
    acac: 'true'
  filter_own_origin:
    acao|contains: corp.lab
  condition: credentialed and not filter_own_origin
fields:
- source_ip
- path
- origin
- acao
- acac
falsepositives:
- партнёрские интеграции с осознанным CORS-списком — ведите allowlist доменов и расширяйте filter_own_origin
level: high
tags:
- attack.initial_access
- attack.t1190
- cwe.942
author: hackbook
related:
- 'payloads-card: payloads/web/headers/cors-misconfiguration.md'
