title: Двойное расширение и гонка загрузки — shell.php.jpg исполняется как PHP
id: e5f6a7b8-0059-4e5f-9a7b-000000000059
status: experimental
description: Имена файлов с двойными расширениями (.php.jpg, .jpg.php) в загрузках и последующие запросы
  к ним внутри каталога загрузок. Второй признак гонки — запрос к файлу раньше, чем отработала антивирусная
  проверка.
references:
- https://attack.mitre.org/techniques/T1190/
logsource:
  category: webserver
  definition: access-лог + логи загрузок с именем файла
detection:
  upload_marker:
    event_action: file_upload
    filename|contains:
    - .php.jpg
    - .php.png
    - .php.gif
    - .jpg.php
    - .png.php
    - .gif.php
    - .phtml.
    - .php%00
  access_marker:
    cs-uri-stem|contains:
    - .jpg.php
    - .png.php
    - .gif.php
    - .php.jpg
  condition: upload_marker or access_marker
fields:
- c-ip
- cs-uri-stem
- sc-status
- filename
falsepositives:
- конвертеры изображений с именами вида photo.php.jpg (практически не встречаются)
level: high
tags:
- attack.initial_access
- attack.t1190
- cwe.434
author: hackbook
related:
- 'payloads-card: payloads/web/upload/race-double-extension.md'
