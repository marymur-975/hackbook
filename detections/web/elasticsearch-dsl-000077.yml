title: Elasticsearch — DSL-инъекция и открытые служебные эндпоинты
id: e5f6a7b8-0077-4e5f-9a7b-000000000077
status: experimental
description: 'Пользователь управляет JSON-запросом к ES: match_all с большим size, script_fields, wildcard.
  Отдельный риск — выставленные наружу /_search, /_cat/indices, /_aliases без аутентификации.'
references:
- https://attack.mitre.org/techniques/T1190/
- https://attack.mitre.org/techniques/T1213/
logsource:
  category: webserver
  definition: access-лог + логи приложения с телом запроса к поиску
detection:
  selection_body:
    request_body|contains:
    - '"match_all"'
    - '"size": 10000'
    - '"script_fields"'
    - '"script":'
    - '"wildcard"'
  selection_endpoint:
    cs-uri-stem|contains:
    - /_search
    - /_cat/indices
    - /_cat/aliases
    - /_aliases
    - /_cluster/health
    - /_nodes
  condition: selection_body or selection_endpoint
fields:
- c-ip
- cs-uri-stem
- sc-status
- request_body
falsepositives:
- внутренние Kibana/мониторинг, легитимно опрашивающие _cluster/health (исключайте по c-ip)
level: medium
tags:
- attack.collection
- attack.t1190
- attack.t1213
- cwe.943
author: hackbook
related:
- 'payloads-card: payloads/web/nosql/elasticsearch-dsl-injection.md'
