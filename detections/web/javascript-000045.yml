title: javascript:-схема в ссылках и сохраняемых полях
id: e5f6a7b8-0045-4e5f-9a7b-000000000045
status: experimental
description: 'javascript:/vbscript:/data:text/html в redirect-параметрах, полях «сайт» и другом сохраняемом
  контенте: при клике или рендере href код выполняется.'
references:
- https://attack.mitre.org/techniques/T1189/
logsource:
  category: webserver
  definition: access-лог и логи приложения с телами запросов (сохраняемые поля)
detection:
  selection_query:
    cs-uri-query|contains:
    - javascript:alert
    - javascript:fetch
    - javascript%3a
    - 'JaVaScRiPt:'
    - 'vbscript:'
    - data:text/html;base64
  selection_body:
    request_body|contains:
    - javascript:alert
    - javascript:fetch
    - data:text/html
  condition: selection_query or selection_body
fields:
- c-ip
- cs-uri-query
- source_ip
- request_body
falsepositives:
- букмарклеты в документации; легитимные data:-URI изображений (data:image/*) — паттерн ограничен data:text/html
level: high
tags:
- attack.initial_access
- attack.t1189
- cwe.79
author: hackbook
related:
- 'payloads-card: payloads/web/xss/href-javascript-scheme.md'
