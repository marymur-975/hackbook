title: LFI с двойным/смешанным URL-кодированием traversal-последовательностей
id: e5f6a7b8-0062-4e5f-9a7b-000000000062
status: experimental
description: В query-строке встречаются %252e/%252f (двойное кодирование) и unicode-варианты ../ — обход
  фильтров, проверяющих только литералы ../ и одноразовое декодирование.
references:
- https://attack.mitre.org/techniques/T1190/
- https://owasp.org/www-community/attacks/Path_Traversal
logsource:
  category: webserver
  definition: access-лог с сырой (не декодированной) query-строкой
detection:
  selection:
    cs-uri-query|contains:
    - '%252e'
    - '%252f'
    - '%255c'
    - '%c0%ae'
    - '%uff0e'
    - ..%255c
    - '%2e%2e%5c'
  condition: selection
fields:
- c-ip
- cs-uri-stem
- cs-uri-query
falsepositives:
- поисковые запросы, дословно содержащие текст про URL-кодирование (статьи/доки)
level: high
tags:
- attack.initial_access
- attack.t1190
- attack.t1027
- cwe.22
author: hackbook
related:
- 'payloads-card: payloads/web/lfi-rfi/double-encoding-bypass.md'
