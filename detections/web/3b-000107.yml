title: Обход аутентификации нормализацией пути — ..;, /.;/, ..%3b
id: e5f6a7b8-0107-4e5f-9a7b-000000000107
status: experimental
description: 'Запрос к защищённому пути с «матричными» обходами (/admin/..;/dashboard, %2e%2e%3b): фронтенд/фильтр
  видит безобидный путь, а бэкенд после нормализации пускает запрос в админ-зону.'
references:
- https://attack.mitre.org/techniques/T1190/
logsource:
  category: webserver
  definition: access-лог и журнал шлюза с сырым (не нормализованным) путём
detection:
  selection_access:
    cs-uri-stem|contains:
    - ..;
    - /.;/
    - ..%3b
    - '%2e%2e%3b'
    - '%2e;'
  selection_gateway:
    path|contains:
    - ..;
    - /.;/
    - ..%3b
    - '%2e%2e%3b'
  condition: selection_access or selection_gateway
fields:
- c-ip
- cs-uri-stem
- path
- sc-status
falsepositives:
- практически отсутствуют: легитимные URL не содержат матричных параметров ..;
level: high
tags:
- attack.initial_access
- attack.t1190
- cwe.863
author: hackbook
related:
- 'payloads-card: payloads/web/auth-bypass/path-traversal-normalization.md'
