title: Request smuggling TE.TE — обфускация Transfer-Encoding
id: e5f6a7b8-0094-4e5f-9a7b-000000000094
status: experimental
description: Значение Transfer-Encoding намеренно искажено (таб/пробел после chunked, «chunked, identity»,
  xchunked, несколько TE-заголовков), чтобы один из серверов цепи проигнорировал TE и переключился на
  Content-Length.
references:
- https://attack.mitre.org/techniques/T1190/
- https://portswigger.net/web-security/request-smuggling
logsource:
  category: proxy
  definition: журнал HTTP-шлюза с сырым значением Transfer-Encoding
detection:
  selection:
    transfer_encoding|contains:
    - "chunked\t"
    - 'chunked '
    - chunked,
    - chunked;
    - xchunked
    - identity
    - "chunked\r"
  condition: selection
fields:
- source_ip
- method
- path
- transfer_encoding
- status
falsepositives:
- практически отсутствуют: корректный TE всегда ровно «chunked» без хвостов
level: high
tags:
- attack.initial_access
- attack.t1190
- attack.t1027
- cwe.444
author: hackbook
related:
- 'payloads-card: payloads/web/http/request-smuggling-te-te.md'
