title: Twig/Smarty SSTI — вызов системных функций из шаблона
id: e5f6a7b8-0009-4e5f-9a7b-000000000009
status: experimental
description: Маркеры эксплуатации Twig (_self.env, registerUndefinedFilterCallback) и Smarty ({php}, Smarty_Internal)
  в параметрах, теле запроса или в ошибках PHP-приложения.
references:
- https://attack.mitre.org/techniques/T1190/
- https://portswigger.net/research/server-side-template-injection
logsource:
  category: application
  definition: логи PHP-приложения с телом запроса и ошибками шаблонизатора
detection:
  query_marker:
    cs-uri-query|contains:
    - _self.env
    - registerUndefinedFilterCallback
    - '{php}'
    - Smarty_Internal
    - getFilter(
  body_marker:
    request_body|contains:
    - _self.env
    - registerUndefinedFilterCallback
    - '{php}'
    - Smarty_Internal
  engine_error:
    error_message|contains:
    - Twig\Error
    - Twig_Error
    - 'RuntimeError: Calling'
    - Smarty exception
  condition: query_marker or body_marker or engine_error
fields:
- c-ip
- cs-uri-query
- request_path
- error_message
falsepositives:
- отладочные выводы Twig в dev-среде
level: high
tags:
- attack.initial_access
- attack.t1190
- cwe.1336
author: hackbook
related:
- 'payloads-card: payloads/web/ssti/php-twig-smarty.md'
