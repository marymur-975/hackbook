title: Stored XSS в профиле/комментариях — обработчики событий в сохраняемых данных
id: e5f6a7b8-0052-4e5f-9a7b-000000000052
status: experimental
description: Действия записи пользовательского контента (профиль, комментарии, тикеты), где в теле встречаются
  обработчики событий (ontoggle, onstart, onload) или iframe srcdoc. Stored XSS сработает позже — при
  просмотре другими пользователями, включая администраторов.
references:
- https://attack.mitre.org/techniques/T1189/
logsource:
  category: application
  definition: 'логи приложения: действия записи контента с телом запроса'
detection:
  stored_action:
    event_action:
    - profile_update
    - comment_create
    - registration
    - support_ticket
  markers:
    request_body|contains:
    - <details open ontoggle
    - ontoggle=
    - <marquee onstart
    - onanimationstart=
    - <body onload
    - <iframe srcdoc
    - <script>
  condition: stored_action and markers
fields:
- source_ip
- request_path
- event_action
- request_body
falsepositives:
- разметка в подписях писем/статьях (ограничьте правило полями профиля и комментариев)
level: high
tags:
- attack.persistence
- attack.t1189
- cwe.79
author: hackbook
related:
- 'payloads-card: payloads/web/xss/stored-in-profile.md'
