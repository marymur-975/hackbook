title: JNDI/RMI-инъекция — lookup на внешний LDAP/RMI и ${jndi:} в параметрах
id: e5f6a7b8-0115-4e5f-9a7b-000000000115
status: experimental
description: Приложение выполняет JNDI-lookup по адресу из пользовательских данных (ldap://attacker, rmi://)
  — log4shell-паттерн ${jndi:...} в параметрах, CommunicationException с внешним адресом в логах, и процесс
  java, порождающий shell (успешная загрузка гаджета).
references:
- https://attack.mitre.org/techniques/T1190/
- https://attack.mitre.org/techniques/T1220/
logsource:
  category: application
  definition: логи приложения и access-лог + auditd execve на java-хостах
detection:
  selection_query:
    cs-uri-query|contains:
    - '${jndi:'
    - jndi:ldap
    - jndi:rmi
    - jndi:dns
  selection_body:
    request_body|contains:
    - '${jndi:'
    - ldap://attacker
    - rmi://attacker
  selection_log:
    error_message|contains:
    - javax.naming
    - ldap://attacker
    - rmi://attacker
    - JndiLookup
  java_shell:
    EventType: EXECVE
    ParentImage|endswith:
    - /java
    Image|endswith:
    - /sh
    - /bash
    - /nc
  condition: selection_query or selection_body or selection_log or java_shell
fields:
- c-ip
- cs-uri-query
- error_message
- ParentImage
- Image
falsepositives:
- легитимные JNDI-lookup на внутренние каталоги (исключайте свои ldap-хосты, но никогда — внешние адреса)
level: critical
tags:
- attack.initial_access
- attack.t1190
- attack.t1220
- cwe.502
- cwe.917
author: hackbook
related:
- 'payloads-card: payloads/web/deserialization/rmi-jmx-jndi.md'
