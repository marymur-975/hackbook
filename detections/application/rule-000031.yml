title: Тавтология в форме входа — успешная аутентификация без пароля
id: e5f6a7b8-0031-4e5f-9a7b-000000000031
status: experimental
description: В учётных данных входа видна тавтология (' OR '1'='1, admin' --), и вход завершился успехом.
  Отдельный сильный признак — успех аутентификации при заведомо мусорном пароле.
references:
- https://attack.mitre.org/techniques/T1190/
logsource:
  category: application
  definition: логи аутентификации приложения (форма входа) и access-лог
detection:
  query_probe:
    cs-uri-query|contains:
    - ''' OR ''1''=''1'
    - ''' OR 1=1'
    - ''' OR ''''='''
    - admin' --
    - ''' OR ''x''=''x'
  login_body:
    event_action:
    - login
    - registration
    request_body|contains:
    - ''' -- -'
    - admin'--
    - ''' OR ''1''=''1'
    - ''' OR 1=1'
  login_success:
    event_outcome: success
  condition: query_probe or (login_body and login_success)
fields:
- source_ip
- request_path
- request_body
- event_outcome
falsepositives:
- пользователи с апострофами в именах (O'Neil) — тавтологические конструкции при этом не встречаются
level: high
tags:
- attack.initial_access
- attack.t1190
- attack.t1078
- cwe.89
author: hackbook
related:
- 'payloads-card: payloads/web/sqli/mysql-tautology-auth-bypass.md'
