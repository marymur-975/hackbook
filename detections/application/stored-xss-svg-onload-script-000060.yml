title: Stored XSS через загруженный SVG — onload/script внутри «картинки»
id: e5f6a7b8-0060-4e5f-9a7b-000000000060
status: experimental
description: Загруженный SVG содержит обработчики событий (onload, onerror, animate onbegin) или script
  — при встраивании картинки в страницу код выполняется в контексте домена приложения.
references:
- https://attack.mitre.org/techniques/T1189/
logsource:
  category: application
  definition: логи загрузок с превью содержимого (SVG — текстовый формат)
detection:
  svg_upload:
    event_action: file_upload
    filename|endswith: .svg
  script_in_svg:
    file_preview|contains:
    - onload=
    - <script
    - onerror=
    - onbegin=
    - 'javascript:'
    - <animate
    - <foreignObject
  condition: svg_upload and script_in_svg
fields:
- source_ip
- filename
- file_preview
falsepositives:
- интерактивные SVG-иллюстрации легитимных дизайнов (редко содержат script/onload)
level: high
tags:
- attack.persistence
- attack.t1189
- cwe.79
author: hackbook
related:
- 'payloads-card: payloads/web/upload/svg-stored-xss.md'
