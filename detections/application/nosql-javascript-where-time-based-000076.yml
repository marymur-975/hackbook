title: NoSQL — JavaScript-инъекция через $where (time-based и логические бомбы)
id: e5f6a7b8-0076-4e5f-9a7b-000000000076
status: experimental
description: 'Оператор $where выполняет произвольный JavaScript на стороне MongoDB: sleep(3000) для слепой
  проверки, this.password для перебора. Видно и в query-строке (%24where), и в теле запроса.'
references:
- https://attack.mitre.org/techniques/T1190/
logsource:
  category: application
  definition: логи приложения с телом запроса + access-лог
detection:
  selection_body:
    request_body|contains:
    - $where
    - function()
    - this.password
    - sleep(3000)
  selection_query:
    cs-uri-query|contains:
    - $where
    - '%24where'
    - sleep(3000)
  condition: selection_body or selection_query
fields:
- source_ip
- request_path
- request_body
- duration_ms
falsepositives:
- легитимные map-reduce с $where практически не встречаются из внешних запросов
level: critical
tags:
- attack.initial_access
- attack.t1190
- cwe.943
author: hackbook
related:
- 'payloads-card: payloads/web/nosql/mongodb-where-js.md'
