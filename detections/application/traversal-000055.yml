title: Загрузка файла с traversal в имени — запись вне каталога загрузок
id: e5f6a7b8-0055-4e5f-9a7b-000000000055
status: experimental
description: В имени загружаемого файла встречаются ../, ..\ или абсолютные пути веб-корня (/var/www,
  inetpub) — попытка записать файл за пределами каталога загрузок.
references:
- https://attack.mitre.org/techniques/T1190/
logsource:
  category: application
  definition: логи загрузок с именем файла (event_action file_upload)
detection:
  upload:
    event_action: file_upload
  traversal:
    filename|contains:
    - ../
    - ..\
    - /var/www
    - C:\inetpub
    - /srv/www
  condition: upload and traversal
fields:
- source_ip
- request_path
- filename
falsepositives:
- массовые импорты с относительными путями внутри пакета (исключайте доверенные API-ключи)
level: high
tags:
- attack.initial_access
- attack.t1190
- cwe.434
- cwe.22
author: hackbook
related:
- 'payloads-card: payloads/web/upload/filename-path-traversal.md'
