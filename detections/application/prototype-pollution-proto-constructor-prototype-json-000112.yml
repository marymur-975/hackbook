title: Prototype pollution — __proto__/constructor.prototype в JSON и query
id: e5f6a7b8-0112-4e5f-9a7b-000000000112
status: experimental
description: Пользовательские данные содержат ключи __proto__ или constructor.prototype — попытка загрязнить
  Object.prototype (isAdmin=true, shell, NODE_OPTIONS). Встречается и в JSON-теле, и в query-параметрах
  (filter[__proto__][...]).
references:
- https://attack.mitre.org/techniques/T1190/
- https://portswigger.net/web-security/prototype-pollution
logsource:
  category: application
  definition: логи приложения с телом запроса + access-лог с query-строкой
detection:
  selection_body:
    request_body|contains:
    - '"__proto__"'
    - __proto__
    - constructor":{"prototype"
    - 'constructor": {"prototype"'
  selection_query:
    cs-uri-query|contains:
    - __proto__
    - constructor[prototype
    - '%5f%5fproto%5f%5f'
  condition: selection_body or selection_query
fields:
- source_ip
- request_path
- request_body
- cs-uri-query
falsepositives:
- JSON-схемы и конфиги, легитимно содержащие ключ __proto__ (крайне редко — сверяйте с кодом)
level: high
tags:
- attack.initial_access
- attack.t1190
- cwe.1321
author: hackbook
related:
- 'payloads-card: payloads/web/deserialization/nodejs-prototype-pollution.md'
