title: Вход с дефолтными учётными данными (admin:admin и типовые пары)
id: e5f6a7b8-0103-4e5f-9a7b-000000000103
status: experimental
description: Успешный вход, где логин и пароль образуют известную дефолтную пару (admin/admin, root/toor),
  либо Basic-аутентификация с base64 таких пар (YWRtaW46YWRtaW4= = admin:admin) на путях админ-панелей.
references:
- https://attack.mitre.org/techniques/T1078/
- https://cwe.mitre.org/data/definitions/1392.html
logsource:
  category: application
  definition: логи аутентификации приложения + журнал шлюза с Authorization
detection:
  selection_body:
    event_action: login
    request_body|contains:
    - username=admin&password=admin
    - user=admin&pass=admin
    - username=root&password=toor
    - password=password
    - username=admin&password=123456
  selection_basic:
    auth_header|contains:
    - Basic YWRtaW46YWRtaW4=
    - Basic cm9vdDp0b29y
    - Basic YWRtaW46cGFzc3dvcmQ=
  condition: selection_body or selection_basic
fields:
- source_ip
- request_path
- event_outcome
- auth_header
falsepositives:
- тестовые стенды и демо-доступы — исключайте известные IP лабораторий
level: critical
tags:
- attack.initial_access
- attack.t1078
- cwe.1392
author: hackbook
related:
- 'payloads-card: payloads/web/auth-bypass/default-credentials.md'
