title: YAML unsafe load — python-теги (!!python/object) во входящем YAML
id: e5f6a7b8-0117-4e5f-9a7b-000000000117
status: experimental
description: Входящий YAML содержит теги !!python/object/apply, !!python/module — yaml.load() с небезопасным
  Loader выполнит произвольный код. Даже отказ безопасного лоадера (ConstructorError) фиксирует попытку.
references:
- https://attack.mitre.org/techniques/T1190/
- https://pyyaml.org/wiki/PyYAMLDocumentation
logsource:
  category: application
  definition: логи приложения с телом запроса и ошибками YAML-парсера
detection:
  selection_body:
    request_body|contains:
    - '!!python/object'
    - '!!python/module'
    - '!!python/name'
    - '!!ruby/object'
    - '!!javax.script'
  selection_error:
    error_message|contains:
    - ConstructorError
    - could not determine a constructor
    - UnsafeLoader
  condition: selection_body or selection_error
fields:
- source_ip
- request_path
- request_body
- error_message
falsepositives:
- конфигурационные репозитории, где !!-теги легитимны (Ansible-подобные DSL) — исключайте внутренние источники
  конфигов
level: high
tags:
- attack.initial_access
- attack.t1190
- cwe.502
author: hackbook
related:
- 'payloads-card: payloads/web/deserialization/yaml-unsafe-load.md'
