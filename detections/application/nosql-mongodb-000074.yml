title: NoSQL-инъекция — операторы MongoDB в пользовательских данных
id: e5f6a7b8-0074-4e5f-9a7b-000000000074
status: experimental
description: 'В теле JSON или в query-параметрах (user[$ne]=1) встречаются операторы MongoDB: $ne, $gt,
  $nin, $exists, $where. Классический эффект — обход аутентификации и перечисление документов.'
references:
- https://attack.mitre.org/techniques/T1190/
- https://owasp.org/www-project-web-security-testing-guide/v42/4-Web_Application_Security_Testing/07-Input_Validation_Testing/05.6-Testing_for_NoSQL_Injection
logsource:
  category: application
  definition: логи приложения с телом запроса + access-лог с query-строкой
detection:
  selection_body:
    request_body|contains:
    - $ne
    - $gt
    - $nin
    - $exists
    - $where
  selection_query:
    cs-uri-query|contains:
    - '[$ne]'
    - '[$gt]'
    - '[$regex]'
    - '[$exists]'
    - '%24ne'
    - '%24gt'
    - '%24where'
  condition: selection_body or selection_query
fields:
- source_ip
- request_path
- request_body
- cs-uri-query
falsepositives:
- приложения, легитимно принимающие Mongo-операторы от доверенных клиентов (админки, BI) — исключайте
  по source_ip/request_path
level: high
tags:
- attack.initial_access
- attack.t1190
- cwe.943
author: hackbook
related:
- 'payloads-card: payloads/web/nosql/mongodb-operator-injection.md'
