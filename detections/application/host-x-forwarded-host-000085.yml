# Команда: python tools/detections-extract.py
# Не редактируйте здесь — правьте секцию `Detection rules` в карточке.
title: Сброс пароля на сторонний хост из заголовка Host/X-Forwarded-Host
id: e5f6a7b8-0085-4e5f-9a7b-000000000085
status: experimental
description: В событии password_reset хост ссылки сброса (reset_link_host) не совпадает с каноническим
  доменом приложения — атакующий подставил Host/X-Forwarded-Host и перехватит токен сброса жертвы.
references:
- https://attack.mitre.org/techniques/T1190/
- https://portswigger.net/web-security/host-header/exploiting
logsource:
  category: application
  definition: 'логи приложения: событие password_reset с host_header и reset_link_host'
detection:
  reset_action:
    event_action: password_reset
  filter_own_host:
    reset_link_host|contains:
    - corp.lab
    - app.example
  condition: reset_action and not filter_own_host
fields:
- source_ip
- request_path
- host_header
- x_forwarded_host
- reset_link_host
falsepositives:
- мультитенантные порталы с собственными доменами клиентов — ведите список разрешённых хостов и дополняйте
  filter_own_host
level: critical
tags:
- attack.credential_access
- attack.t1190
- cwe.644
author: hackbook
related:
- 'payloads-card: payloads/web/http/host-header-password-reset.md'
