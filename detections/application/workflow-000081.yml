title: Пропуск шага workflow — подтверждение неоплаченного заказа
id: e5f6a7b8-0081-4e5f-9a7b-000000000081
status: experimental
description: Событие подтверждения/завершающего шага приходит при payment_status=unpaid (или без предшествующего
  события оплаты того же order_id). Прямой запрос /checkout/confirm в обход /checkout/pay — признак перескока
  через шаг workflow.
references:
- https://attack.mitre.org/techniques/T1190/
logsource:
  category: application
  definition: 'логи приложения: события шагов checkout с order_id и payment_status'
detection:
  selection:
    event_action:
    - checkout_confirm
    - order_finalize
    - subscription_activate
  unpaid:
    payment_status:
    - unpaid
    - pending
    - ''
  condition: selection and unpaid
fields:
- source_ip
- request_path
- order_id
- payment_status
falsepositives:
- оплата при получении (payment_status=pending легален для таких товаров — сверяйте с типом оплаты заказа)
level: high
tags:
- attack.impact
- attack.t1190
- cwe.841
