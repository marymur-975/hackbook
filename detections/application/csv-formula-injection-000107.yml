title: Признак CSV/formula injection в сохраняемых пользовательских данных
id: b2c3d4e5-0007-4b2c-8d3e-000000000107
status: experimental
description: Пользовательские значения, начинающиеся с символов формул (= + - @) или содержащие DDE/HYPERLINK-конструкции,
  — признак подготовки атаки на сотрудников, открывающих выгрузки.
references:
- https://owasp.org/www-community/attacks/CSV_Injection
logsource:
  category: application
  product: web
  definition: логи приложения с содержимым полей форм или WAF-логи тела запроса
detection:
  formula_prefix:
    request_body|contains:
    - =&
    - =HYPERLINK
    - =cmd|
    - =WEBSERVICE
    - =IMPORTDATA
    - '@SUM('
    - =+cmd
  dde:
    request_body|contains:
    - cmd|'/C
    - powershell|
    - 'ms-msdt:'
  condition: formula_prefix or dde
fields:
- source_ip
- request_path
- user_name
falsepositives:
- легитимные значения, начинающиеся со знака (математические записи, отрицательные числа)
level: medium
tags:
- attack.execution
- attack.t1204.002
- cwe.1236
author: hackbook
related:
- 'payloads-card: payloads/web/detection/csv-formula-injection.md'
