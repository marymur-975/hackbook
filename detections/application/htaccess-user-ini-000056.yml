title: Загрузка .htaccess/.user.ini — переопределение обработчика расширений
id: e5f6a7b8-0056-4e5f-9a7b-000000000056
status: experimental
description: Пользователь загружает конфигурационный файл веб-сервера (.htaccess, .user.ini, web.config)
  с AddType/SetHandler application/x-httpd-php — после этого «картинки» в каталоге загрузок исполняются
  как PHP. На файловой системе видно как запись .htaccess процессом веб-сервера.
references:
- https://attack.mitre.org/techniques/T1190/
- https://attack.mitre.org/techniques/T1505/003/
logsource:
  category: application
  definition: логи загрузок + auditd на запись конфигурационных файлов веб-сервера
detection:
  upload_config:
    event_action: file_upload
    filename|endswith:
    - .htaccess
    - .user.ini
    - web.config
    - .htpasswd
  handler_body:
    file_preview|contains:
    - AddType application/x-httpd-php
    - SetHandler application/x-httpd-php
    - php_value auto_prepend_file
    - php_flag engine on
  audit_write:
    EventType: PATH
    Name|endswith:
    - .htaccess
    - .user.ini
  condition: upload_config or handler_body or audit_write
fields:
- source_ip
- filename
- file_preview
- Name
- Image
falsepositives:
- деплой легитимных .htaccess через CI/CD (исключайте по Image/User в auditd)
level: high
tags:
- attack.persistence
- attack.t1190
- attack.t1505.003
- cwe.434
author: hackbook
related:
- 'payloads-card: payloads/web/upload/htaccess-handler-override.md'
