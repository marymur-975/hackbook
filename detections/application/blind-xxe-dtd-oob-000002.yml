title: Blind XXE — параметрическая сущность с внешней DTD (OOB-канал)
id: e5f6a7b8-0002-4e5f-9a7b-000000000002
status: experimental
description: В теле XML-запроса объявлена параметрическая сущность (% x), загружающая внешнюю DTD по http/https.
  Признак слепого XXE с exfiltration через подконтрольный атакующему сервер.
references:
- https://attack.mitre.org/techniques/T1190/
logsource:
  category: application
  product: xml_parser
  definition: логи приложения/WAF с телом запроса
detection:
  xml_request:
    request_content_type|contains: xml
  doctype:
    request_body|contains: <!DOCTYPE
  param_entity:
    request_body|contains:
    - <!ENTITY %
    - <!ENTITY%
  external_http:
    request_body|contains:
    - SYSTEM "http
    - SYSTEM 'http
    - SYSTEM "https
    - SYSTEM 'https
  condition: xml_request and doctype and param_entity and external_http
fields:
- source_ip
- request_path
- request_body
falsepositives:
- XML-импорты, ссылающиеся на внешние схемы по https (вносите в исключения по домену)
level: high
tags:
- attack.initial_access
- attack.t1190
- cwe.611
author: hackbook
related:
- 'payloads-card: payloads/web/xxe/blind-oob-exfiltration.md'
