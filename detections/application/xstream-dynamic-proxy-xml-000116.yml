title: XStream-гаджеты — dynamic-proxy и опасные классы в входящем XML
id: e5f6a7b8-0116-4e5f-9a7b-000000000116
status: experimental
description: 'Входящий XML содержит конструкции XStream-гаджетов: <dynamic-proxy>, <sorted-set> с Comparable-хендлером,
  EventHandler/ProcessBuilder. XStream до 1.4.18 десериализует их в RCE.'
references:
- https://attack.mitre.org/techniques/T1190/
- https://x-stream.github.io/CVE-2021-39144.html
logsource:
  category: application
  definition: логи приложения/WAF с телом XML-запроса
detection:
  selection_body:
    request_body|contains:
    - <dynamic-proxy>
    - <sorted-set>
    - java.beans.EventHandler
    - XStreamException
    - <interface>java.lang.Comparable
  selection_error:
    error_message|contains:
    - XStreamException
    - xstream
  condition: selection_body or selection_error
fields:
- source_ip
- request_path
- request_body
- error_message
falsepositives:
- внутренние интеграции, легитимно использующие XStream (фиксируйте список эндпоинтов и обновите XStream
  до 1.4.20+)
level: high
tags:
- attack.initial_access
- attack.t1190
- cwe.502
author: hackbook
related:
- 'payloads-card: payloads/web/deserialization/xstream-xml.md'
