title: NTLM-relay — сетевой вход машинной учётки с чужого IP
id: a7b8c9d0-0006-4a7b-9c8d-000000000006
status: experimental
description: 'Event 4624 (LogonType 3, NTLM), где TargetUserName — машинная учётка ($), а IpAddress не
  совпадает с зарегистрированным адресом узла: атакующий ретранслировал NTLM-аутентификацию (signing не
  обязателен).'
references:
- https://attack.mitre.org/techniques/T1557/001/
logsource:
  product: windows
  service: security
  definition: аудит logon-событий; для точности сопоставляйте IpAddress с CMDB/DNS
detection:
  selection:
    EventID: 4624
    LogonType: 3
    AuthenticationPackageName: NTLM
    TargetUserName|endswith: $
  filter_dc:
    TargetUserName:
    - DC01$
    - DC02$
  condition: selection and not filter_dc
fields:
- TargetUserName
- IpAddress
- LogonProcessName
falsepositives:
- легитимный межсерверный NTLM (файловые кластеры, легаси-интеграции) — сверяйте IpAddress с инвентаризацией
  узла; целевое состояние — SMB signing required и отказ от NTLM
level: high
tags:
- attack.credential_access
- attack.t1557.001
- cwe.294
author: hackbook
related:
- 'payloads-card: payloads/network/smb-signing-relay.md'
