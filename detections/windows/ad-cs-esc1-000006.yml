title: Выпуск сертификата AD CS с чужим субъектом (ESC1-признак)
id: a1b2c3d4-0006-4a1b-9c1d-000000000006
status: experimental
description: Запрос сертификата, где атрибут Subject Alternative Name или Subject содержит имя, отличное
  от учётки заявителя, либо привилегированное имя.
logsource:
  product: windows
  service: security
  definition: CA-хост, аудит Certification Services (Events 4886/4887)
detection:
  selection:
    EventID:
    - 4886
    - 4887
  priv_subject:
    Subject|contains:
    - Administrator
    - Domain Admin
    - Enterprise Admin
    - krbtgt
  condition: selection and priv_subject
falsepositives:
- легитимный выпуск сервисных сертификатов для админ-учёток (сопоставляйте с CMDB)
level: critical
tags:
- attack.credential_access
- attack.t1649
author: hackbook
