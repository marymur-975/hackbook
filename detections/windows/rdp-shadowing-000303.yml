# Команда: python tools/detections-extract.py
# Не редактируйте здесь — правьте секцию `Detection rules` в карточке.
title: 'Аномальная RDP-активность: перебор, shadowing и входы в нерабочее время'
id: d4e5f6a7-0003-4d4e-8f5a-000000000303
status: test
description: Неудачные RemoteInteractive-входы пачками, подключение к чужой сессии (shadowing), а также
  успешные RDP-входы привилегированных учёток с новых адресов.
references:
- https://attack.mitre.org/techniques/T1021/001/
- https://attack.mitre.org/techniques/T1136/
logsource:
  product: windows
  service: security
  definition: EventID 4624/4625 (LogonType 10), 4778/4779, TerminalServices-LocalSessionManager
detection:
  failed_rdp:
    EventID: 4625
    LogonType: 10
  success_rdp:
    EventID: 4624
    LogonType: 10
  reconnect:
    EventID:
    - 4778
    - 4779
  shadow_tool:
    EventID: 4688
    CommandLine|contains:
    - tscon
    - ' /shadow'
    - qwinsta
  ntlm_rdp:
    EventID: 4624
    LogonType: 10
    AuthenticationPackageName: NTLM
  timeframe: 10m
  condition: shadow_tool or (failed_rdp | count() by IpAddress > 10) or (success_rdp and ntlm_rdp) or
    reconnect
fields:
- IpAddress
- TargetUserName
- LogonType
- AuthenticationPackageName
- CommandLine
falsepositives:
- легитимная поддержка с подключением к сессиям (фиксируйте список учёток и Shadow-политику)
- переключения сессий администраторами между хостами
level: high
tags:
- attack.lateral_movement
- attack.initial_access
- attack.t1021.001
author: hackbook
related:
- 'payloads-card: payloads/network/rdp-exposure.md'
