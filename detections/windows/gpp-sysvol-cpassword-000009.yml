title: Чтение GPP-файлов из SYSVOL — поиск cpassword
id: a7b8c9d0-0009-4a7b-9c8d-000000000009
status: experimental
description: 'Массовое чтение Groups.xml/Services.xml/ScheduledTasks.xml/DataSources.xml из SYSVOL не-администратором
  (event 4663): в них могут лежать зашифрованные AES-256 ключом Microsoft (давно опубликован) пароли cpassword.'
references:
- https://attack.mitre.org/techniques/T1552/006/
logsource:
  product: windows
  service: security
  definition: SACL Object Access на шаре SYSVOL + сетевой доступ к \\\\dc\\SYSVOL
detection:
  sysvol_path:
    EventID: 4663
    ObjectName|contains: SYSVOL
  gpp_files:
    ObjectName|contains:
    - Groups.xml
    - Services.xml
    - ScheduledTasks.xml
    - DataSources.xml
    - Printers.xml
    - Drives.xml
  condition: sysvol_path and gpp_files
fields:
- SubjectUserName
- ObjectName
- IpAddress
falsepositives:
- применение политик самими DC (исключайте машинные учётки DC) и аудит безопасности — сверяйте с расписанием
  сканов
level: high
tags:
- attack.credential_access
- attack.t1552.006
- cwe.312
author: hackbook
related:
- 'payloads-card: payloads/network/ad/gpp-cpassword-sysvol.md'
