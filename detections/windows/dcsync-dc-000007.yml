title: DCSync — доступ к атрибутам репликации не-DC учёткой
id: a1b2c3d4-0007-4a1b-9c1d-000000000007
status: stable
description: Event 4662 с правами DS-Replication-Get-Changes(-All), где субъект не является машинной учёткой
  контроллера домена. Высокая точность при включённом SACL.
references:
- https://attack.mitre.org/techniques/T1003/006/
logsource:
  product: windows
  service: security
  definition: 'SACL на объекте домена: Audit Directory Service Access (Success)'
detection:
  selection:
    EventID: 4662
    Properties|contains:
    - 1131f6aa-9c07-11d1-f79f-00c04fc2dcd2
    - 1131f6ad-9c07-11d1-f79f-00c04fc2dcd2
    - 89e95b76-444d-4c62-991a-0facbeda640c
  filter_dc:
    SubjectUserName|endswith: $
  filter_replication_service:
    SubjectUserName:
    - svc_mim
    - svc_backup
  condition: selection and not filter_dc and not filter_replication_service
falsepositives:
- сервисы репликации (MIM, FIM), решения резервного копирования с делегированием
level: critical
tags:
- attack.credential_access
- attack.t1003.006
author: hackbook
related:
