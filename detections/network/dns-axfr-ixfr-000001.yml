title: Передача зоны DNS (AXFR/IXFR) посторонним клиентом
id: a7b8c9d0-0001-4a7b-9c8d-000000000001
status: experimental
description: 'В журнале BIND (или другого authoritative-сервера) появляются записи AXFR started/ended
  — клиент запросил полную копию зоны. Вне списка вторичных NS это всегда аномалия: зона содержит внутреннюю
  топологию.'
references:
- https://attack.mitre.org/techniques/T1590/
logsource:
  category: dns
  definition: журнал authoritative DNS-сервера (query log / xfer log)
detection:
  selection:
    service: bind
    message|contains:
    - AXFR
    - IXFR
    - zone transfer
    - transfer of
  condition: selection
fields:
- source_ip
- message
falsepositives:
- штатные вторичные NS и скрытые master-передачи — ведите allowlist IP (allow-transfer) и исключайте их
  в фильтре
level: high
tags:
- attack.discovery
- attack.t1590
- cwe.16
author: hackbook
related:
- 'payloads-card: payloads/network/dns-zone-transfer.md'
