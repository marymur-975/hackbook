title: Azure IMDS — запрос токена managed identity изнутри ВМ
id: f6a7b8c9-0014-4f6a-8b9c-000000000014
status: experimental
description: GET к 169.254.169.254/metadata/identity/oauth2/token с заголовком Metadata:true — выдача
  OAuth-токена управляемого удостоверения. Через SSRF в App Service это полный захват прав identity.
references:
- https://attack.mitre.org/techniques/T1552/005/
- https://learn.microsoft.com/en-us/azure/active-directory/managed-identities-azure-resources/how-to-use-vm-token
logsource:
  category: firewall
  definition: egress-лог прокси/файрвола App Service/VM
detection:
  selection:
    dst_ip: 169.254.169.254
    uri|contains: metadata/identity/oauth2/token
  condition: selection
fields:
- src_ip
- dst_ip
- uri
falsepositives:
- штатные SDK Azure берут токены identity регулярно — алертуйте на источники, которым identity не положена
  (публичные веб-приложения после SSRF), и на resource= не из вашего списка
level: high
tags:
- attack.credential_access
- attack.t1552.005
- cwe.918
author: hackbook
related:
- 'payloads-card: payloads/cloud/azure-imds-managed-identity.md'
