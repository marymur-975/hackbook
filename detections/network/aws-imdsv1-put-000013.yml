# Команда: python tools/detections-extract.py
# Не редактируйте здесь — правьте секцию `Detection rules` в карточке.
title: AWS IMDSv1 — учётные данные роли без сессионного PUT-токена
id: f6a7b8c9-0013-4f6a-8b9c-000000000013
status: experimental
description: 'GET к /latest/meta-data/iam/security-credentials/ на 169.254.169.254: при IMDSv1 любой процесс
  (или SSRF) в инстансе забирает временные ключи роли одним запросом. IMDSv2 требует предварительный PUT
  /latest/api/token.'
references:
- https://attack.mitre.org/techniques/T1552/005/
- https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-instance-metadata.html
logsource:
  category: firewall
  definition: egress-лог прокси/файрвола + VPC flow logs (dst 169.254.169.254)
detection:
  selection:
    dst_ip: 169.254.169.254
    http_method: GET
  credentials_path:
    uri|contains:
    - latest/meta-data/iam/security-credentials
    - latest/user-data
  condition: selection and credentials_path
fields:
- src_ip
- dst_ip
- http_method
- uri
falsepositives:
- легитимные вызовы SDK внутри инстансов (постоянный фон) — детект ценен для публичных сервисов и в корреляции
  с SSRF-индикаторами; главный фикс — принудительный IMDSv2 (HttpTokens=required, hop limit 1)
level: high
tags:
- attack.credential_access
- attack.t1552.005
- cwe.918
author: hackbook
related:
- 'payloads-card: payloads/cloud/aws-imdsv1-role-credentials.md'
