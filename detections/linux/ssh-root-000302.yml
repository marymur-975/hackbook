title: 'Аномальная SSH-активность: перебор, вход root по паролю, туннелирование'
id: d4e5f6a7-0002-4d4e-8f5a-000000000302
status: test
description: 'Комбинация признаков атак на SSH: массовые неудачные аутентификации, успешный вход root
  по паролю, запуск ssh с флагами проброса, добавление ключей в authorized_keys.'
references:
- https://attack.mitre.org/techniques/T1021/004/
- https://attack.mitre.org/techniques/T1098/004/
logsource:
  product: linux
  service: auth
  definition: журнал аутентификации (auth.log / journalctl -u sshd)
detection:
  brute_force:
    process: sshd
    message|contains:
    - Failed password
    - Invalid user
    - maximum authentication attempts exceeded
  root_password_login:
    process: sshd
    message|contains: Accepted password for root
  new_key:
    process: sshd
    message|contains: Authentication succeeded (publickey)
  ssh_forward:
    EventType: EXECVE
    Image|endswith: /ssh
    CommandLine|contains:
    - ' -L'
    - ' -R'
    - ' -D'
    - ProxyCommand
  authorized_keys_write:
    EventType: PATH
    Name|endswith: /.ssh/authorized_keys
    auid|gte: 1000
  timeframe: 10m
  condition: root_password_login or authorized_keys_write or ssh_forward or (brute_force | count() by
    source_ip > 20)
fields:
- source_ip
- user
- message
- CommandLine
falsepositives:
- легитимные туннели разработчиков (сужайте по учётке и целевому хосту)
- ротация ключей автоматизацией (выделенная учётка и расписание)
level: high
tags:
- attack.lateral_movement
- attack.credential_access
- attack.t1021.004
- attack.t1098.004
author: hackbook
related:
- 'payloads-card: payloads/network/ssh-misconfiguration.md'
