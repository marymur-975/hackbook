title: Docker socket escape — docker run --privileged -v / из контейнера
id: f6a7b8c9-0019-4f6a-8b9c-000000000019
status: experimental
description: 'Процесс использует /var/run/docker.sock: запуск контейнера с монтированием корня узла (-v
  /:/host), --privileged или chroot /host — полный захват хоста изнутри контейнера.'
references:
- https://attack.mitre.org/techniques/T1610/
- https://attack.mitre.org/techniques/T1086/
logsource:
  product: linux
  service: auditd
  definition: 'auditd: execve docker CLI + обращения к /var/run/docker.sock'
detection:
  socket_run:
    EventType: EXECVE
    CommandLine|contains:
    - docker.sock
    - --privileged
    - -v /:/host
    - chroot /host
    - -v /:/
  socket_access:
    EventType: PATH
    Name: /var/run/docker.sock
  filter_dockerd:
    Image|endswith:
    - /dockerd
    - /containerd
    - /docker-compose
  condition: (socket_run or socket_access) and not filter_dockerd
fields:
- Image
- CommandLine
- ParentImage
- User
- Name
falsepositives:
- системные процессы dockerd/containerd (отфильтрованы) и CI-джобы, легитимно строящие образы через сокет
  — выносите их по User/ParentImage, лучше замените на rootless/buildah
level: critical
tags:
- attack.privilege_escalation
- attack.t1610
- cwe.250
author: hackbook
related:
- 'payloads-card: payloads/cloud/docker-socket-escape.md'
