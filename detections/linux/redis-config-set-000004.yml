title: Redis без аутентификации — команды от внешнего клиента и CONFIG SET
id: a7b8c9d0-0004-4a7b-9c8d-000000000004
status: experimental
description: Команды к Redis без AUTH от не-локальных клиентов; особо опасны CONFIG SET dir/dbfile (запись
  cron/ssh-ключей), SLAVEOF/REPLICAOF (RCE через репликацию) и MODULE LOAD.
references:
- https://attack.mitre.org/techniques/T1190/
- https://redis.io/docs/latest/operate/oss_and_stack/management/security/
logsource:
  product: linux
  service: redis
  definition: журнал redis-server (loglevel notice+) или сетевой лог порта 6379
detection:
  selection:
    service: redis
    message|contains:
    - without AUTH
    - no AUTH
    - NOAUTH
    - CONFIG SET
    - SLAVEOF
    - REPLICAOF
    - MODULE LOAD
    - FLUSHALL
  condition: selection
fields:
- source_ip
- message
falsepositives:
- внутренние сентинелы и реплики (SLAVEOF от известных master) — исключайте по source_ip, но AUTH остаётся
  обязательным
level: critical
tags:
- attack.initial_access
- attack.t1190
- cwe.306
author: hackbook
related:
- 'payloads-card: payloads/network/redis-unauthenticated.md'
