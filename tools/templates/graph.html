<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>hackbook — граф знаний</title>
    <style>
      :root {
        --bg: #0e1117;
        --panel: #161b22;
        --panel-2: #1c2230;
        --fg: #e6edf3;
        --muted: #8b949e;
        --bd: #30363d;
        --accent: #58a6ff;
        --c-web: #58a6ff;
        --c-network: #3fb950;
        --c-cloud: #bc8cff;
        --c-ad: #f778ba;
        --c-priv: #ffa657;
        --c-general: #8b949e;
        --c-lab: #e3b341;
        --c-chapter: #ffffff;
        --danger: #f85149;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font:
          14px/1.5 -apple-system,
          "Segoe UI",
          Roboto,
          "Helvetica Neue",
          Arial,
          sans-serif;
        overflow: hidden;
      }
      #app {
        display: grid;
        grid-template-columns: 290px 1fr 330px;
        grid-template-rows: auto 1fr;
        height: 100vh;
      }
      header {
        grid-column: 1/-1;
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 0.6rem 1rem;
        border-bottom: 1px solid var(--bd);
        background: var(--panel);
      }
      header h1 {
        font-size: 1rem;
        margin: 0;
        font-weight: 650;
        letter-spacing: 0.2px;
      }
      header h1 span {
        color: var(--accent);
      }
      .badges {
        display: flex;
        gap: 0.4rem;
        flex-wrap: wrap;
        font-size: 0.75rem;
        color: var(--muted);
      }
      .badges b {
        color: var(--fg);
        font-weight: 600;
      }
      .spacer {
        flex: 1;
      }
      aside {
        background: var(--panel);
        border-right: 1px solid var(--bd);
        overflow-y: auto;
        padding: 0.9rem;
      }
      aside.right {
        border-right: 0;
        border-left: 1px solid var(--bd);
      }
      h2 {
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.09em;
        color: var(--muted);
        margin: 1.1rem 0 0.5rem;
        font-weight: 650;
      }
      h2:first-child {
        margin-top: 0;
      }
      input[type="search"],
      select {
        width: 100%;
        padding: 0.45rem 0.6rem;
        background: var(--panel-2);
        border: 1px solid var(--bd);
        border-radius: 6px;
        color: var(--fg);
        font-size: 0.85rem;
      }
      input[type="search"]:focus,
      select:focus {
        outline: none;
        border-color: var(--accent);
      }
      label.chk {
        display: flex;
        align-items: center;
        gap: 0.45rem;
        padding: 0.22rem 0;
        cursor: pointer;
        font-size: 0.85rem;
      }
      label.chk input {
        accent-color: var(--accent);
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        display: inline-block;
        flex: 0 0 auto;
      }
      .row {
        display: flex;
        gap: 0.4rem;
        align-items: center;
        flex-wrap: wrap;
      }
      button {
        background: var(--panel-2);
        border: 1px solid var(--bd);
        color: var(--fg);
        border-radius: 6px;
        padding: 0.35rem 0.6rem;
        font-size: 0.8rem;
        cursor: pointer;
      }
      button:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      button.active {
        background: var(--accent);
        border-color: var(--accent);
        color: #0b1220;
        font-weight: 600;
      }
      #stage {
        position: relative;
        overflow: hidden;
        background: radial-gradient(circle at 30% 20%, #151b26 0%, #0e1117 60%);
      }
      #graph,
      #fallback {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #fallback {
        display: none;
      }
      .legend {
        position: absolute;
        left: 0.8rem;
        bottom: 0.8rem;
        background: rgba(13, 17, 23, 0.86);
        border: 1px solid var(--bd);
        border-radius: 8px;
        padding: 0.6rem 0.75rem;
        font-size: 0.75rem;
        backdrop-filter: blur(4px);
        max-width: 250px;
      }
      .legend div {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        margin: 0.15rem 0;
      }
      .hint {
        position: absolute;
        right: 0.8rem;
        bottom: 0.8rem;
        color: var(--muted);
        font-size: 0.72rem;
        background: rgba(13, 17, 23, 0.7);
        border: 1px solid var(--bd);
        border-radius: 6px;
        padding: 0.3rem 0.5rem;
      }
      .node-card {
        background: var(--panel-2);
        border: 1px solid var(--bd);
        border-radius: 8px;
        padding: 0.8rem;
      }
      .node-card h3 {
        margin: 0 0 0.2rem;
        font-size: 1rem;
        line-height: 1.3;
      }
      .node-card .sub {
        color: var(--muted);
        font-size: 0.78rem;
        margin-bottom: 0.6rem;
      }
      .kv {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 0.15rem 0.6rem;
        font-size: 0.8rem;
      }
      .kv dt {
        color: var(--muted);
      }
      .kv dd {
        margin: 0;
        word-break: break-word;
      }
      .tag {
        display: inline-block;
        background: #21262d;
        border: 1px solid var(--bd);
        border-radius: 999px;
        padding: 0.05rem 0.45rem;
        font-size: 0.7rem;
        margin: 0.12rem 0.15rem 0 0;
        color: var(--muted);
      }
      code {
        background: #0d1117;
        border: 1px solid var(--bd);
        border-radius: 4px;
        padding: 0.05rem 0.3rem;
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        font-size: 0.78rem;
        color: #ffa657;
      }
      pre {
        background: #0d1117;
        border: 1px solid var(--bd);
        border-left: 3px solid var(--accent);
        border-radius: 6px;
        padding: 0.5rem 0.6rem;
        overflow-x: auto;
        font-size: 0.75rem;
        line-height: 1.45;
      }
      pre code {
        background: none;
        border: 0;
        padding: 0;
        color: #e6edf3;
        white-space: pre;
      }
      a {
        color: var(--accent);
      }
      .empty {
        color: var(--muted);
        font-size: 0.85rem;
      }
      .rel {
        font-size: 0.8rem;
        padding: 0.35rem 0;
        border-bottom: 1px dashed var(--bd);
      }
      .rel:last-child {
        border-bottom: 0;
      }
      .rel .t {
        color: var(--muted);
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .diff {
        display: inline-flex;
        gap: 2px;
        vertical-align: middle;
      }
      .diff i {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #30363d;
        display: inline-block;
      }
      .diff i.on {
        background: var(--accent);
      }
      #stats td {
        padding: 0.1rem 0.4rem 0.1rem 0;
        font-size: 0.8rem;
      }
      #stats td:last-child {
        text-align: right;
        color: var(--muted);
      }
      .notice {
        font-size: 0.72rem;
        color: var(--muted);
        border-top: 1px solid var(--bd);
        margin-top: 0.8rem;
        padding-top: 0.6rem;
      }
      @media (max-width: 1200px) {
        #app {
          grid-template-columns: 250px 1fr;
        }
        aside.right {
          display: none;
        }
      }
      @media (max-width: 820px) {
        #app {
          grid-template-columns: 1fr;
          grid-template-rows: auto 1fr;
        }
        aside {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <h1>hackbook <span>/ граф знаний</span></h1>
        <div class="badges" id="topBadges"></div>
        <div class="spacer"></div>
        <div class="row">
          <button id="btnD3" title="Форс-раскладка">force</button>
          <button id="btnRadial" title="Раскладка по категориям">radial</button>
          <button id="btnFreeze" title="Остановить/запустить симуляцию">
            ⏸
          </button>
          <button id="btnFit" title="Вписать граф">⤢</button>
        </div>
      </header>

      <aside class="left">
        <h2>Поиск</h2>
        <input
          type="search"
          id="q"
          placeholder="payload, тег, CWE, путь…"
          autocomplete="off"
        />
        <h2>Тип узла</h2>
        <div id="kindFilters"></div>
        <h2>Категория</h2>
        <div id="catFilters"></div>
        <h2>Сложность</h2>
        <div class="row" id="diffFilters"></div>
        <h2>Рёбра</h2>
        <div id="edgeFilters"></div>
        <label class="chk" style="margin-top: 0.4rem">
          <input type="checkbox" id="hideIsolated" /> скрыть изолированные узлы
        </label>
        <h2>Статистика</h2>
        <table id="stats"></table>
        <div class="notice">
          Граф сгенерирован из метаданных Markdown:
          <code>tools/graph-generator.py</code>.<br />
          Данные: <a href="graph.json">graph.json</a>
        </div>
      </aside>

      <div id="stage">
        <svg id="graph"></svg>
        <canvas id="fallback"></canvas>
        <div class="legend" id="legend"></div>
        <div class="hint">
          колесо — масштаб · перетаскивание — движение · клик — детали
        </div>
      </div>

      <aside class="right">
        <h2>Узел</h2>
        <div id="details"><p class="empty">Выберите узел на карте.</p></div>
      </aside>
    </div>

    <script id="hackbook-data" type="application/json">
      __HACKBOOK_GRAPH_DATA__
    </script>
    <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
    <script>
      (function () {
        "use strict";

        // ── ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ (перенесены наверх) ────────────────────
        var COLORS = {
          web: "#58a6ff",
          network: "#3fb950",
          cloud: "#bc8cff",
          "active-directory": "#f778ba",
          "privilege-escalation": "#ffa657",
          lab: "#e3b341",
          general: "#8b949e",
        };
        var KIND_R = {
          chapter: 15,
          technique: 13,
          concept: 8,
          payload: 6,
          lab: 11,
        };
        var KIND_LABEL = {
          chapter: "глава",
          technique: "техника",
          concept: "понятие",
          payload: "payload",
          lab: "лаборатория",
        };

        var DATA = { graph: { nodes: [], edges: [] }, meta: {} };
        var nodes = [],
          links = [],
          byId = {},
          adjacency = {},
          selected = null;
        var svgRoot = null,
          gRoot = null,
          linkSel = null,
          nodeSel = null,
          labelSel = null,
          sim = null;
        var canvasMode = false,
          ctx = null,
          canvas = null,
          view = { x: 0, y: 0, k: 1 },
          W = 800,
          H = 600;

        var state = {
          q: "",
          kinds: {},
          cats: {},
          diffs: {},
          edges: {},
          hideIsolated: false,
          layout: "force",
          frozen: false,
        };

        // ── ЖЕСТКАЯ ЗАЩИТА ОТ ПАДЕНИЙ ─────────────────────────────────────
        function radius(n) {
          if (!n) return 6;
          var kind = n.kind ? String(n.kind) : "concept";
          var base = KIND_R[kind] || 7;
          var count =
            typeof n.payloads_count === "number" ? n.payloads_count : 0;
          var extra = Math.min(6, Math.log2(1 + count));
          return base + extra;
        }

        function boot() {
          try {
            var rawNodes = DATA.graph.nodes || [];
            nodes = rawNodes
              .filter(function (n) {
                return n && typeof n === "object";
              })
              .map(function (n) {
                var m = Object.assign({}, n);
                if (!m.kind) m.kind = "concept";
                if (!m.category) m.category = "general";
                m.r = radius(m);
                m.color = COLORS[m.category] || COLORS.general;
                return m;
              });
            byId = {};
            nodes.forEach(function (n) {
              byId[n.id] = n;
            });

            var rawEdges = DATA.graph.edges || [];
            links = rawEdges
              .filter(function (e) {
                return e && byId[e.source] && byId[e.target];
              })
              .map(function (e) {
                return {
                  source: byId[e.source],
                  target: byId[e.target],
                  type: e.type,
                  description: e.description || "",
                };
              });

            adjacency = {};
            nodes.forEach(function (n) {
              adjacency[n.id] = [];
            });
            links.forEach(function (l) {
              adjacency[l.source.id].push({ other: l.target, link: l });
              adjacency[l.target.id].push({ other: l.source, link: l });
            });

            buildUI();
            if (window.d3) {
              initD3();
            } else {
              initCanvas();
            }
            applyFilters();
          } catch (err) {
            console.error("Ошибка при инициализации графа:", err);
          }
        }

        // ── ИНИЦИАЛИЗАЦИЯ ─────────────────────────────────────────────────
        try {
          DATA = JSON.parse(
            document.getElementById("hackbook-data").textContent,
          );
        } catch (e) {
          console.error("bad graph data", e);
        }

        if (!DATA.graph || !DATA.graph.nodes || !DATA.graph.nodes.length) {
          fetch("graph.json")
            .then(function (r) {
              return r.json();
            })
            .then(function (j) {
              DATA = { graph: j, meta: j.meta || {} };
              boot();
            })
            .catch(function () {
              boot();
            });
        } else {
          boot();
        }

        // ── UI ────────────────────────────────────────────────────────────
        function buildUI() {
          var meta = DATA.meta || {};
          var t = meta.totals || {};
          document.getElementById("topBadges").innerHTML =
            badge("узлов", t.nodes) +
            badge("рёбер", t.edges) +
            badge("payload'ов", t.payloads) +
            badge("глав", t.chapters) +
            badge("лаб", t.labs) +
            (meta.generated_at
              ? badge("обновлено", meta.generated_at.slice(0, 10))
              : "");

          checkboxGroup(
            "kindFilters",
            countBy(nodes, "kind"),
            state.kinds,
            KIND_LABEL,
          );
          checkboxGroup(
            "catFilters",
            countBy(nodes, "category"),
            state.cats,
            COLORS,
          );
          checkboxGroup(
            "edgeFilters",
            countBy(links, "type"),
            state.edges,
            null,
          );

          var df = document.getElementById("diffFilters");
          [1, 2, 3, 4].forEach(function (d) {
            var b = document.createElement("button");
            b.textContent = [
              "—",
              "beginner",
              "intermediate",
              "advanced",
              "expert",
            ][d];
            b.className = "active";
            b.onclick = function () {
              state.diffs[d] = !state.diffs[d];
              b.classList.toggle("active", !state.diffs[d]);
              applyFilters();
            };
            df.appendChild(b);
          });

          document.getElementById("q").addEventListener("input", function (e) {
            state.q = e.target.value.trim().toLowerCase();
            applyFilters();
          });
          document
            .getElementById("hideIsolated")
            .addEventListener("change", function (e) {
              state.hideIsolated = e.target.checked;
              applyFilters();
            });
          document
            .getElementById("btnFreeze")
            .addEventListener("click", function () {
              state.frozen = !state.frozen;
              this.textContent = state.frozen ? "▶" : "⏸";
              if (sim) {
                state.frozen ? sim.stop() : sim.alpha(0.3).restart();
              }
              this.classList.toggle("active", state.frozen);
            });
          document.getElementById("btnFit").addEventListener("click", fit);
          document
            .getElementById("btnD3")
            .addEventListener("click", function () {
              setLayout("force");
            });
          document
            .getElementById("btnRadial")
            .addEventListener("click", function () {
              setLayout("radial");
            });

          var lg = document.getElementById("legend");
          lg.innerHTML =
            Object.keys(COLORS)
              .map(function (k) {
                return (
                  '<div><span class="dot" style="background:' +
                  COLORS[k] +
                  '"></span>' +
                  (k === "active-directory"
                    ? "Active Directory"
                    : k === "privilege-escalation"
                      ? "Эскалация привилегий"
                      : k === "general"
                        ? "общее"
                        : k === "lab"
                          ? "лаборатории"
                          : k) +
                  "</div>"
                );
              })
              .join("") +
            '<div style="margin-top:.35rem;color:var(--muted)">размер = число payload\'ов</div>';

          var st = document.getElementById("stats");
          var rows = [];
          Object.keys(meta.payloads_by_type || {}).forEach(function (k) {
            rows.push([k, meta.payloads_by_type[k]]);
          });
          st.innerHTML = rows
            .map(function (r) {
              return "<tr><td>" + r[0] + "</td><td>" + r[1] + "</td></tr>";
            })
            .join("");
        }

        function badge(label, value) {
          return value === undefined || value === null
            ? ""
            : '<span class="tag">' + label + ": <b>" + value + "</b></span>";
        }
        function countBy(arr, key) {
          var out = {};
          arr.forEach(function (x) {
            var k = x[key] || "?";
            out[k] = (out[k] || 0) + 1;
          });
          return out;
        }
        function checkboxGroup(hostId, counts, store, colorMap) {
          var host = document.getElementById(hostId);
          host.innerHTML = "";
          Object.keys(counts)
            .sort(function (a, b) {
              return counts[b] - counts[a];
            })
            .forEach(function (k) {
              var l = document.createElement("label");
              l.className = "chk";
              var dot =
                colorMap && typeof colorMap === "object" && colorMap[k]
                  ? '<span class="dot" style="background:' +
                    colorMap[k] +
                    '"></span>'
                  : "";
              l.innerHTML =
                '<input type="checkbox" checked>' +
                dot +
                "<span>" +
                k +
                "</span>" +
                '<span style="margin-left:auto;color:var(--muted)">' +
                counts[k] +
                "</span>";
              l.querySelector("input").addEventListener("change", function (e) {
                store[k] = !e.target.checked;
                applyFilters();
              });
              host.appendChild(l);
            });
        }

        // ── ФИЛЬТРАЦИЯ ────────────────────────────────────────────────────
        function matches(n) {
          if (state.kinds[n.kind]) return false;
          if (state.cats[n.category || "general"]) return false;
          if (n.kind === "payload" && state.diffs[n.difficulty || 2])
            return false;
          if (state.hideIsolated && !(adjacency[n.id] || []).length)
            return false;
          if (!state.q) return true;
          var hay = [
            n.id,
            n.label,
            n.category,
            n.kind,
            n.ptype,
            n.target,
            n.cwe,
            n.path,
            (n.tags || []).join(" "),
          ]
            .join(" ")
            .toLowerCase();
          return hay.indexOf(state.q) >= 0;
        }

        function applyFilters() {
          var visible = {};
          nodes.forEach(function (n) {
            n._vis = matches(n);
            if (n._vis) visible[n.id] = true;
          });
          links.forEach(function (l) {
            l._vis =
              visible[l.source.id] &&
              visible[l.target.id] &&
              !state.edges[l.type];
          });
          if (canvasMode) {
            draw();
          } else {
            updateD3();
          }
          var shown = nodes.filter(function (n) {
            return n._vis;
          }).length;
          var tag = document
            .getElementById("topBadges")
            .querySelectorAll(".tag")[0];
          if (tag)
            tag.innerHTML = "видно: <b>" + shown + "</b>/" + nodes.length;
        }

        // ── D3-РЕНДЕР ─────────────────────────────────────────────────────
        function initD3() {
          var stage = document.getElementById("stage");
          W = stage.clientWidth;
          H = stage.clientHeight;
          svgRoot = d3.select("#graph").attr("viewBox", [0, 0, W, H]);
          svgRoot.selectAll("*").remove();
          var defs = svgRoot.append("defs");
          [
            "leads_to",
            "instance_of",
            "related_to",
            "technique_of",
            "covered_in",
            "practiced_in",
            "requires",
            "category_of",
            "uses",
          ].forEach(function (t) {
            defs
              .append("marker")
              .attr("id", "arw-" + t)
              .attr("viewBox", "0 -5 10 10")
              .attr("refX", 16)
              .attr("refY", 0)
              .attr("markerWidth", 6)
              .attr("markerHeight", 6)
              .attr("orient", "auto")
              .append("path")
              .attr("d", "M0,-5L10,0L0,5")
              .attr("fill", t === "leads_to" ? "#f85149" : "#48535f");
          });
          gRoot = svgRoot.append("g");
          linkSel = gRoot.append("g").attr("fill", "none").selectAll("line");
          nodeSel = gRoot.append("g").selectAll("circle");
          labelSel = gRoot.append("g").selectAll("text");

          svgRoot.call(
            d3
              .zoom()
              .scaleExtent([0.15, 6])
              .on("zoom", function (ev) {
                gRoot.attr("transform", ev.transform);
              }),
          );

          sim = d3
            .forceSimulation(nodes)
            .force(
              "link",
              d3
                .forceLink(links)
                .id(function (d) {
                  return d.id;
                })
                .distance(function (l) {
                  return l.type === "instance_of" ? 42 : 90;
                })
                .strength(0.35),
            )
            .force(
              "charge",
              d3.forceManyBody().strength(function (d) {
                return -90 - d.r * 12;
              }),
            )
            .force("center", d3.forceCenter(W / 2, H / 2))
            .force(
              "collide",
              d3.forceCollide(function (d) {
                return d.r + 5;
              }),
            )
            .on("tick", ticked);

          updateD3();
          window.addEventListener("resize", function () {
            W = stage.clientWidth;
            H = stage.clientHeight;
            svgRoot.attr("viewBox", [0, 0, W, H]);
            sim.force("center", d3.forceCenter(W / 2, H / 2));
            sim.alpha(0.3).restart();
          });
        }

        function highlight() {
          var hl = highlighted();
          linkSel.attr("stroke-opacity", function (l) {
            return !hl || hl[l.source.id] || hl[l.target.id] ? 0.8 : 0.06;
          });
          nodeSel.attr("opacity", function (d) {
            return !hl || hl[d.id] ? 1 : 0.18;
          });
          labelSel.attr("opacity", function (d) {
            return !hl || hl[d.id] ? 1 : 0.15;
          });
        }

        function updateD3() {
          var vl = links.filter(function (l) {
            return l._vis;
          });
          var vn = nodes.filter(function (n) {
            return n._vis;
          });

          linkSel = linkSel.data(vl, function (d) {
            return d.source.id + ">" + d.target.id + d.type;
          });
          linkSel.exit().remove();
          linkSel = linkSel
            .enter()
            .append("line")
            .attr("stroke-width", 1.1)
            .attr("stroke-opacity", 0.55)
            .merge(linkSel)
            .attr("stroke", function (d) {
              return d.type === "leads_to" ? "#f85149" : "#48535f";
            })
            .attr("stroke-dasharray", function (d) {
              return d.type === "related_to" ? "3 3" : null;
            })
            .attr("marker-end", function (d) {
              return "url(#arw-" + d.type + ")";
            });

          nodeSel = nodeSel.data(vn, function (d) {
            return d.id;
          });
          nodeSel.exit().remove();
          nodeSel = nodeSel
            .enter()
            .append("circle")
            .attr("stroke", "#0e1117")
            .attr("stroke-width", 1.4)
            .attr("cursor", "pointer")
            .call(dragBehaviour())
            .on("click", function (ev, d) {
              select(d);
              ev.stopPropagation();
            })
            .merge(nodeSel)
            .attr("r", function (d) {
              return d.r;
            })
            .attr("fill", function (d) {
              return d.color;
            })
            .attr("fill-opacity", function (d) {
              return d.kind === "payload" ? 0.72 : 0.95;
            })
            .attr("stroke", function (d) {
              return d.id === (selected && selected.id) ? "#fff" : "#0e1117";
            });

          labelSel = labelSel.data(
            vn.filter(function (d) {
              return d.kind !== "payload" || state.q || d.r > 12;
            }),
            function (d) {
              return d.id;
            },
          );
          labelSel.exit().remove();
          labelSel = labelSel
            .enter()
            .append("text")
            .attr("font-size", 9.5)
            .attr("fill", "#c9d1d9")
            .attr("pointer-events", "none")
            .attr("dx", 8)
            .attr("dy", 3)
            .merge(labelSel)
            .text(function (d) {
              return d.label && d.label.length > 34
                ? d.label.slice(0, 33) + "…"
                : d.label;
            });

          sim.nodes(nodes);
          sim.force("link").links(vl);
          if (!state.frozen) sim.alpha(0.35).restart();
          highlight();
        }

        function dragBehaviour() {
          return d3
            .drag()
            .on("start", function (ev, d) {
              if (!ev.active && !state.frozen) sim.alphaTarget(0.25).restart();
              d.fx = d.x;
              d.fy = d.y;
            })
            .on("drag", function (ev, d) {
              d.fx = ev.x;
              d.fy = ev.y;
            })
            .on("end", function (ev, d) {
              if (!ev.active) sim.alphaTarget(0);
              d.fx = null;
              d.fy = null;
            });
        }

        function ticked() {
          linkSel
            .attr("x1", function (d) {
              return d.source.x;
            })
            .attr("y1", function (d) {
              return d.source.y;
            })
            .attr("x2", function (d) {
              return d.target.x;
            })
            .attr("y2", function (d) {
              return d.target.y;
            });
          nodeSel
            .attr("cx", function (d) {
              return d.x;
            })
            .attr("cy", function (d) {
              return d.y;
            });
          labelSel
            .attr("x", function (d) {
              return d.x;
            })
            .attr("y", function (d) {
              return d.y;
            });
        }

        function setLayout(mode) {
          state.layout = mode;
          document
            .getElementById("btnD3")
            .classList.toggle("active", mode === "force");
          document
            .getElementById("btnRadial")
            .classList.toggle("active", mode === "radial");
          if (!sim) return;
          if (mode === "radial") {
            var cats = Object.keys(COLORS);
            sim.force(
              "radial",
              d3
                .forceRadial(
                  function (d) {
                    return d.kind === "payload"
                      ? 340
                      : d.kind === "technique"
                        ? 170
                        : 60;
                  },
                  W / 2,
                  H / 2,
                )
                .strength(0.6),
            );
            sim.force(
              "angular",
              d3
                .forceX(function (d) {
                  var i = Math.max(0, cats.indexOf(d.category || "general"));
                  return (
                    W / 2 + Math.cos((i / cats.length) * 2 * Math.PI) * 260
                  );
                })
                .strength(0.12),
            );
            sim.force("center", null);
          } else {
            sim.force("radial", null);
            sim.force("angular", null);
            sim.force("center", d3.forceCenter(W / 2, H / 2));
          }
          if (!state.frozen) sim.alpha(0.7).restart();
          if (canvasMode) draw();
        }

        function fit() {
          if (canvasMode) {
            fitCanvas();
            return;
          }
          var xs = nodes
            .filter(function (n) {
              return n._vis;
            })
            .map(function (n) {
              return n.x || 0;
            });
          var ys = nodes
            .filter(function (n) {
              return n._vis;
            })
            .map(function (n) {
              return n.y || 0;
            });
          if (!xs.length) return;
          var x0 = Math.min.apply(null, xs),
            x1 = Math.max.apply(null, xs);
          var y0 = Math.min.apply(null, ys),
            y1 = Math.max.apply(null, ys);
          var k = Math.min(4, 0.85 / Math.max((x1 - x0) / W, (y1 - y0) / H));
          svgRoot
            .transition()
            .duration(450)
            .call(
              d3.zoom().transform,
              d3.zoomIdentity
                .translate(
                  W / 2 - (k * (x0 + x1)) / 2,
                  H / 2 - (k * (y0 + y1)) / 2,
                )
                .scale(k),
            );
        }

        // ── CANVAS-РЕНДЕР ─────────────────────────────────────────────────
        function initCanvas() {
          canvasMode = true;
          document.getElementById("graph").style.display = "none";
          canvas = document.getElementById("fallback");
          canvas.style.display = "block";
          ctx = canvas.getContext("2d");
          resizeCanvas();
          nodes.forEach(function (n, i) {
            var a = (i / nodes.length) * Math.PI * 2,
              r = 120 + (i % 7) * 34;
            n.x = W / 2 + Math.cos(a) * r;
            n.y = H / 2 + Math.sin(a) * r;
            n.vx = 0;
            n.vy = 0;
          });
          window.addEventListener("resize", function () {
            resizeCanvas();
            draw();
          });
          var drag = null,
            panning = false,
            last = null;
          canvas.addEventListener("mousedown", function (e) {
            var p = toWorld(e),
              hit = pick(p);
            if (hit) {
              drag = hit;
              select(hit);
            } else {
              panning = true;
            }
            last = { x: e.clientX, y: e.clientY };
          });
          window.addEventListener("mousemove", function (e) {
            if (drag) {
              var p = toWorld(e);
              drag.x = p.x;
              drag.y = p.y;
              drag.vx = drag.vy = 0;
              draw();
            } else if (panning && last) {
              view.x += e.clientX - last.x;
              view.y += e.clientY - last.y;
              last = { x: e.clientX, y: e.clientY };
              draw();
            } else {
              canvas.style.cursor = pick(toWorld(e)) ? "pointer" : "grab";
            }
          });
          window.addEventListener("mouseup", function () {
            drag = null;
            panning = false;
            last = null;
          });
          canvas.addEventListener(
            "wheel",
            function (e) {
              e.preventDefault();
              var f = e.deltaY < 0 ? 1.12 : 1 / 1.12;
              var p = { x: e.offsetX, y: e.offsetY };
              view.x = p.x - (p.x - view.x) * f;
              view.y = p.y - (p.y - view.y) * f;
              view.k *= f;
              draw();
            },
            { passive: false },
          );
          for (var i = 0; i < 320; i++) step();
          fitCanvas();
        }

        function resizeCanvas() {
          var stage = document.getElementById("stage");
          W = stage.clientWidth;
          H = stage.clientHeight;
          var dpr = window.devicePixelRatio || 1;
          canvas.width = W * dpr;
          canvas.height = H * dpr;
          canvas.style.width = W + "px";
          canvas.style.height = H + "px";
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        function toWorld(e) {
          var r = canvas.getBoundingClientRect();
          return {
            x: (e.clientX - r.left - view.x) / view.k,
            y: (e.clientY - r.top - view.y) / view.k,
          };
        }
        function pick(p) {
          for (var i = nodes.length - 1; i >= 0; i--) {
            var n = nodes[i];
            if (!n._vis) continue;
            var dx = n.x - p.x,
              dy = n.y - p.y;
            if (dx * dx + dy * dy <= (n.r + 4) * (n.r + 4)) return n;
          }
          return null;
        }
        function step() {
          var i, j, a, b, dx, dy, d, f;
          for (i = 0; i < nodes.length; i++) {
            a = nodes[i];
            if (!a._vis) continue;
            for (j = i + 1; j < nodes.length; j++) {
              b = nodes[j];
              if (!b._vis) continue;
              dx = b.x - a.x;
              dy = b.y - a.y;
              d = Math.sqrt(dx * dx + dy * dy) || 0.01;
              if (d > 320) continue;
              f = -900 / (d * d);
              a.vx -= (dx / d) * f * 0.02;
              a.vy -= (dy / d) * f * 0.02;
              b.vx += (dx / d) * f * 0.02;
              b.vy += (dy / d) * f * 0.02;
            }
          }
          links.forEach(function (l) {
            if (!l._vis) return;
            dx = l.target.x - l.source.x;
            dy = l.target.y - l.source.y;
            d = Math.sqrt(dx * dx + dy * dy) || 0.01;
            var want = l.type === "instance_of" ? 45 : 95;
            f = (d - want) * 0.004;
            l.source.vx += (dx / d) * f;
            l.source.vy += (dy / d) * f;
            l.target.vx -= (dx / d) * f;
            l.target.vy -= (dy / d) * f;
          });
          nodes.forEach(function (n) {
            if (!n._vis) return;
            n.vx += (W / 2 - n.x) * 0.0009;
            n.vy += (H / 2 - n.y) * 0.0009;
            n.vx *= 0.82;
            n.vy *= 0.82;
            n.x += n.vx;
            n.y += n.vy;
          });
        }
        function fitCanvas() {
          var vis = nodes.filter(function (n) {
            return n._vis;
          });
          if (!vis.length) return;
          var x0 = 1e9,
            x1 = -1e9,
            y0 = 1e9,
            y1 = -1e9;
          vis.forEach(function (n) {
            x0 = Math.min(x0, n.x);
            x1 = Math.max(x1, n.x);
            y0 = Math.min(y0, n.y);
            y1 = Math.max(y1, n.y);
          });
          view.k = Math.min(3, 0.85 / Math.max((x1 - x0) / W, (y1 - y0) / H));
          view.x = W / 2 - (view.k * (x0 + x1)) / 2;
          view.y = H / 2 - (view.k * (y0 + y1)) / 2;
          draw();
        }
        function draw() {
          if (!ctx) return;
          if (!state.frozen) step();
          ctx.clearRect(0, 0, W, H);
          ctx.save();
          ctx.translate(view.x, view.y);
          ctx.scale(view.k, view.k);
          var hl = highlighted();
          links.forEach(function (l) {
            if (!l._vis) return;
            var on = !hl || hl[l.source.id] || hl[l.target.id];
            ctx.beginPath();
            ctx.moveTo(l.source.x, l.source.y);
            ctx.lineTo(l.target.x, l.target.y);
            ctx.strokeStyle =
              l.type === "leads_to"
                ? on
                  ? "rgba(248,81,73,.85)"
                  : "rgba(248,81,73,.12)"
                : on
                  ? "rgba(139,148,158,.5)"
                  : "rgba(139,148,158,.08)";
            ctx.lineWidth = (on ? 1.2 : 0.7) / Math.sqrt(view.k);
            if (l.type === "related_to") ctx.setLineDash([3, 3]);
            else ctx.setLineDash([]);
            ctx.stroke();
          });
          ctx.setLineDash([]);
          nodes.forEach(function (n) {
            if (!n._vis) return;
            var on = !hl || hl[n.id];
            ctx.beginPath();
            ctx.arc(n.x, n.y, n.r, 0, 6.2832);
            ctx.fillStyle = on ? n.color : "rgba(120,130,140,.18)";
            ctx.globalAlpha = on ? (n.kind === "payload" ? 0.78 : 0.95) : 0.35;
            ctx.fill();
            ctx.globalAlpha = 1;
            ctx.lineWidth = selected && selected.id === n.id ? 2.4 : 1.2;
            ctx.strokeStyle =
              selected && selected.id === n.id ? "#fff" : "#0e1117";
            ctx.stroke();
            if (on && (n.kind !== "payload" || state.q || view.k > 1.6)) {
              ctx.fillStyle = "rgba(201,209,217,.92)";
              ctx.font = 9.5 / Math.sqrt(view.k) + "px sans-serif";
              var t =
                n.label && n.label.length > 34
                  ? n.label.slice(0, 33) + "…"
                  : n.label;
              ctx.fillText(t, n.x + n.r + 3, n.y + 3);
            }
          });
          ctx.restore();
        }
        function highlighted() {
          if (!selected) return null;
          var out = {};
          out[selected.id] = true;
          (adjacency[selected.id] || []).forEach(function (a) {
            out[a.other.id] = true;
          });
          return out;
        }

        // ── ПАНЕЛЬ ДЕТАЛЕЙ ────────────────────────────────────────────────
        function select(n) {
          selected = n;
          var host = document.getElementById("details");
          if (!n) {
            host.innerHTML = '<p class="empty">Выберите узел на карте.</p>';
            return;
          }
          var rels = (adjacency[n.id] || [])
            .map(function (a) {
              var dir = a.link.source.id === n.id ? "→" : "←";
              var t =
                (DATA.meta.labels &&
                  DATA.meta.labels.edges &&
                  DATA.meta.labels.edges[a.link.type]) ||
                a.link.type;
              return (
                '<div class="rel"><span class="t">' +
                dir +
                " " +
                esc(t) +
                "</span><br>" +
                '<a href="#" data-id="' +
                a.other.id +
                '">' +
                esc(a.other.label || a.other.id) +
                "</a>" +
                (a.link.description
                  ? '<div style="color:var(--muted);font-size:.75rem">' +
                    esc(a.link.description) +
                    "</div>"
                  : "") +
                "</div>"
              );
            })
            .join("");

          host.innerHTML =
            '<div class="node-card"><h3>' +
            esc(n.label || n.id) +
            "</h3>" +
            '<div class="sub">' +
            esc(KIND_LABEL[n.kind] || n.kind || "") +
            (n.category ? " · " + esc(n.category) : "") +
            diff(n.difficulty) +
            "</div>" +
            "<dl class='kv'>" +
            kv("id", "<code>" + esc(n.id) + "</code>") +
            (n.ptype ? kv("тип", esc(n.ptype)) : "") +
            (n.target ? kv("цель", esc(n.target)) : "") +
            (n.bypass && n.bypass !== "none"
              ? kv("обход", esc(n.bypass))
              : "") +
            (n.risk ? kv("риск", esc(n.risk)) : "") +
            (n.cwe
              ? kv(
                  "CWE",
                  '<a href="https://cwe.mitre.org/data/definitions/' +
                    esc(String(n.cwe).replace("CWE-", "")) +
                    '.html" target="_blank" rel="noopener">' +
                    esc(n.cwe) +
                    "</a>",
                )
              : "") +
            (n.payloads_count ? kv("payload'ов", n.payloads_count) : "") +
            (n.success_rate
              ? kv("успех", Math.round(n.success_rate * 100) + "%")
              : "") +
            (n.path ? kv("файл", "<code>" + esc(n.path) + "</code>") : "") +
            (n.chapter_number !== undefined && n.chapter_number !== null
              ? kv("глава №", n.chapter_number)
              : "") +
            "</dl>" +
            (n.tags && n.tags.length
              ? '<div style="margin-top:.5rem">' +
                n.tags
                  .map(function (t) {
                    return '<span class="tag">#' + esc(t) + "</span>";
                  })
                  .join("") +
                "</div>"
              : "") +
            "</div>" +
            "<h2>Связи (" +
            (adjacency[n.id] || []).length +
            ")</h2>" +
            (rels || '<p class="empty">Связей нет.</p>');

          host.querySelectorAll("a[data-id]").forEach(function (a) {
            a.addEventListener("click", function (e) {
              e.preventDefault();
              select(byId[a.dataset.id]);
              render();
            });
          });
          render();
        }
        function kv(k, v) {
          return "<dt>" + k + "</dt><dd>" + v + "</dd>";
        }
        function diff(d) {
          if (!d) return "";
          var s = '<span class="diff">';
          for (var i = 1; i <= 4; i++)
            s += '<i class="' + (i <= d ? "on" : "") + '"></i>';
          return s + "</span>";
        }
        function esc(s) {
          return String(s === undefined || s === null ? "" : s)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
        }
        function render() {
          if (canvasMode) draw();
          else {
            nodeSel
              .attr("stroke", function (d) {
                return selected && d.id === selected.id ? "#fff" : "#0e1117";
              })
              .attr("stroke-width", function (d) {
                return selected && d.id === selected.id ? 2.6 : 1.4;
              });
            var hl = highlighted();
            linkSel.attr("stroke-opacity", function (l) {
              return !hl || hl[l.source.id] || hl[l.target.id] ? 0.8 : 0.06;
            });
            nodeSel.attr("opacity", function (d) {
              return !hl || hl[d.id] ? 1 : 0.18;
            });
            labelSel.attr("opacity", function (d) {
              return !hl || hl[d.id] ? 1 : 0.15;
            });
          }
        }

        document
          .getElementById("stage")
          .addEventListener("click", function (e) {
            if (e.target.id === "stage" || e.target.id === "graph") {
              selected = null;
              select(null);
            }
          });
        setLayout("force");
      })();
    </script>
  </body>
</html>
