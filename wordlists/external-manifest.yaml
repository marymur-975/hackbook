# Манифест внешних словарей hackbook.
#
# Крупные наборы (утечки паролей, SecLists, fuzzdb) НЕ хранятся в git:
# они объёмны, а часть содержит данные реальных пользователей. Вместо этого
# здесь описано, откуда их взять, как проверить целостность и как использовать.
#
# Команды:
#   python tools/wordlist-manifest.py --list              # что описано и что загружено
#   python tools/wordlist-manifest.py --fetch <id>        # скачать набор
#   python tools/wordlist-manifest.py --fetch all         # скачать всё (осторожно!)
#   python tools/wordlist-manifest.py --check             # сверить sha256 загруженного
#   python tools/wordlist-manifest.py --pin <id>          # закрепить sha256 после загрузки
#
# Политика:
#   * загрузка только по HTTPS;
#   * файлы пишутся в wordlists/external/ (каталог в .gitignore);
#   * sha256 закрепляется командой --pin после первой загрузки и вашей проверки
#     содержимого — дальше --check ловит подмену или повреждение;
#   * пустое значение sha256 = набор ещё не закреплён (--check выдаст WARN).

version: 1
updated: "2026-10-23"
policy:
  https_only: true
  target_dir: "external/"
  verify_sha256: true
  max_bytes_per_set: 1073741824     # 1 ГиБ на набор
  license_review_required: true     # прежде чем распространять производные — читайте лицензию

# Как добавлять набор:
#   1. Найдите официальный источник (репозиторий проекта, а не зеркало).
#   2. Прочитайте лицензию: часть утечек распространяется «только для
#      исследований» — это нужно отразить в `license` и в `usage`.
#   3. Добавьте запись в `sets` с прямым URL на raw-файл.
#   4. --fetch <id>, проверьте содержимое, затем --pin <id>.
#   5. Если набор нужен для задания книги — укажите `use_cases` и добавьте
#      пример команды в wordlists/README.md.

